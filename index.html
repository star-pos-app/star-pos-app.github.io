<style>
/* Layout: barra superior fija con navegación; Venta = catálogo + carrito lado a lado, el resto son tablas y formularios */
:root{
  --bg:#F5F4FA; --surface:#FFFFFF; --surface2:#ECEAF4; --line:#DAD7E6;
  --fg:#1C1933; --muted:#66637F; --accent:#5557AE; --accent-fg:#FFFFFF; --accent-soft:#E6E6F7;
  --ok:#14774C; --ok-bg:#DDF2E8; --warn:#9A5806; --warn-bg:#FBEBCF; --bad:#BD2430; --bad-bg:#FBE0E2;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-head:'Space Grotesk','Inter',system-ui,sans-serif;
  --r1:8px; --r2:12px; --shadow:0 1px 2px rgba(30,25,80,.05),0 6px 18px -10px rgba(30,25,80,.18);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12111C; --surface:#1B1A29; --surface2:#262439; --line:#35334C; --fg:#EEECFB; --muted:#A3A0C0;
  --accent:#A9ABF2; --accent-fg:#1A1B44; --accent-soft:#2A2B58;
  --ok:#52C78F; --ok-bg:#16352A; --warn:#EBA63F; --warn-bg:#3A2B12; --bad:#FF8087; --bad-bg:#401D22; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12111C; --surface:#1B1A29; --surface2:#262439; --line:#35334C; --fg:#EEECFB; --muted:#A3A0C0;
  --accent:#A9ABF2; --accent-fg:#1A1B44; --accent-soft:#2A2B58;
  --ok:#52C78F; --ok-bg:#16352A; --warn:#EBA63F; --warn-bg:#3A2B12; --bad:#FF8087; --bad-bg:#401D22; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 24px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
h1,h2,h3{font-family:var(--font-head);margin:0;text-wrap:balance}
h2{font-size:20px} h3{font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,td.r,th.r,.money{font-variant-numeric:tabular-nums}
.wrap{max-width:1440px;margin:0 auto}
/* top */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--line);
  margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 16px;padding:8px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.top .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;max-width:1440px;margin:0 auto}
.brand{font-family:var(--font-head);font-weight:700;font-size:18px;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;background:var(--accent);display:inline-block;transform:rotate(45deg)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--muted);border:0}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)}
nav{display:flex;gap:2px;overflow-x:auto;margin-top:6px;max-width:1440px;margin-inline:auto;scrollbar-width:thin}
nav a{padding:9px 14px;color:var(--muted);text-decoration:none;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
nav a svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav a.on svg{color:var(--accent)}
nav a.on{color:var(--fg);border-bottom-color:var(--accent)}
nav a:hover{color:var(--fg)}
/* controls */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r1);padding:8px 14px;font-weight:600;min-height:38px;transition:background .15s,filter .15s,transform .05s}.btn:active{transform:translateY(1px)}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)} .btn.pri:hover{filter:brightness(1.07)}
.btn.bad{color:var(--bad);border-color:var(--bad)} .btn.sm{padding:4px 10px;min-height:30px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:38px;width:100%;min-width:0}
input[type=checkbox]{width:auto;min-height:0;accent-color:var(--accent)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
label.f input,label.f select{font-weight:400;color:var(--fg)}
label.ck{display:flex;align-items:center;gap:8px;font-size:14px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar .grow{flex:1 1 220px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:16px;box-shadow:var(--shadow)}
.muted{color:var(--muted)} .small{font-size:12px}
.pill{display:inline-block;border-radius:99px;padding:1px 8px;font-size:11px;font-weight:700;background:var(--surface2);color:var(--muted)}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.tblw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface2);position:sticky;top:0}
td.r,th.r{text-align:right} tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer} tbody tr.click:hover td{background:var(--surface2)}
td.wrapc{white-space:normal;min-width:180px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.tile-s{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px;box-shadow:var(--shadow)}
.tile-s b{display:block;font-family:var(--font-head);font-size:24px;margin-top:2px}
.tile-s span{font-size:12px;color:var(--muted);font-weight:600}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.banner{border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.banner.warn{background:var(--warn-bg);color:var(--warn)} .banner.bad{background:var(--bad-bg);color:var(--bad)}
/* venta */
.pos{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,430px);gap:16px;align-items:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px}
.tile{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:4px;min-height:92px;justify-content:space-between}
.tile:hover{border-color:var(--accent)} .tile .tn{font-weight:600;font-size:13px;overflow-wrap:anywhere}
.tile .tp{font-family:var(--font-head);font-weight:700;font-size:17px;color:var(--accent)} .tile .tc{font-size:11px;color:var(--muted)}
.tile.off{opacity:.55}
.cart{position:sticky;top:calc(env(safe-area-inset-top,0px) + 96px);background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;max-height:calc(100vh - 120px)}
.cart>div{padding:12px 14px} .cart .lines{overflow-y:auto;flex:1;min-height:120px;padding:0 14px;border-block:1px solid var(--line)}
.line{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.line:last-child{border-bottom:0}
.line .ln{font-weight:600;font-size:13px;overflow-wrap:anywhere}
.line .lt{font-family:var(--font-head);font-weight:700;text-align:right}
.line .ctl{grid-column:1/-1;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.line .ctl input{width:64px;min-height:30px;padding:3px 6px;text-align:right}
.line .ctl .q{width:48px;text-align:center}
.step{width:30px;min-height:30px;border:1px solid var(--line);background:var(--surface2);border-radius:6px;font-weight:700;padding:0}
.tot{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:13px}
.tot .big{font-family:var(--font-head);font-size:28px;font-weight:700;grid-column:1/-1;display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts .pri{grid-column:1/-1;font-size:17px;min-height:48px}
@media(max-width:860px){.pos{grid-template-columns:1fr}.cart{position:static;max-height:none}}
/* modal */
#modal{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 12px 16px;overflow-y:auto}
#modal[hidden]{display:none}
.scrim{position:fixed;inset:0;background:rgba(10,8,25,.55)}
.dlg{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--r2) + 2px);width:100%;max-width:520px;padding:18px;margin:auto;display:flex;flex-direction:column;gap:14px}
.dlg.wide{max-width:820px}
.dlg .hd{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlg .ft{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:200;display:flex;flex-direction:column;gap:6px;align-items:center;width:min(92vw,420px)}
.toast{background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.25);text-align:center}
.toast.bad{background:var(--bad);color:#fff}
.payrow{display:grid;grid-template-columns:130px 1fr auto;gap:8px;align-items:center}
.payinfo{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:700;padding:10px 12px;border-radius:10px;background:var(--surface2)}
.due{font-family:var(--font-head);font-size:34px;font-weight:700}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tcard{border:2px solid var(--line);background:var(--surface);border-radius:var(--r2);padding:10px;text-align:left;display:grid;gap:6px;min-height:0}
.tcard.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tcard .sw{display:flex;height:34px;border-radius:8px;overflow:hidden;border:1px solid rgba(128,128,128,.3)}.tcard .sw i{flex:1}
.tcard b{font-size:13px}.tcard span{font-size:12px;color:var(--muted)}
.tkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px 16px}
.tkprev{background:#fff;color:#000;border:1px dashed #999;border-radius:6px;padding:12px;font-family:'Courier New',monospace;font-size:12px;max-width:300px;width:100%}
.tkprev h4{margin:0;text-align:center;font-size:14px}.tkprev .c{text-align:center}.tkprev hr{border:0;border-top:1px dashed #000}.tkprev table{width:100%;border-collapse:collapse}.tkprev td,.tkprev th{padding:1px 0;border:0;background:none;color:#000;font-size:12px;text-transform:none;letter-spacing:0;white-space:normal;position:static}.tkprev .r{text-align:right}
.cust{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cust label{display:flex;align-items:center;gap:10px;font-weight:600}.cust input[type=color]{width:42px;height:34px;padding:2px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.paymodes{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:6px}
.paymodes .btn.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.payrow.single{grid-template-columns:1fr}.payrow.single label{display:none}
.quick{display:flex;gap:6px;flex-wrap:wrap}
/* ticket */
.ticket{background:#fff;color:#111;font-family:'Courier New',ui-monospace,monospace;font-size:12.5px;padding:14px;border-radius:8px;border:1px dashed #999;max-width:340px;margin:0 auto;width:100%}
.ticket h4{margin:0;text-align:center;font-size:15px} .ticket .c{text-align:center} .ticket hr{border:0;border-top:1px dashed #555;margin:6px 0}
.ticket table{width:100%;border-collapse:collapse} .ticket td,.ticket th{padding:1px 0;border:0;background:none;color:#111;font-size:12.5px;text-transform:none;letter-spacing:0;white-space:normal;position:static}
.ticket .r{text-align:right}
/* chart */
.chart{display:flex;align-items:flex-end;gap:4px;height:150px;padding-top:8px;border-bottom:1px solid var(--line)}
.chart .b{flex:1;min-width:6px;background:var(--accent);border-radius:3px 3px 0 0;position:relative}
.chart .b:hover{filter:brightness(1.15)}
.xl{display:flex;gap:4px;font-size:10px;color:var(--muted)} .xl span{flex:1;text-align:center;min-width:6px;overflow:hidden}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-top:16px}

.sbar{display:flex;gap:10px;margin-bottom:8px}
input.big{font-size:18px;min-height:54px;padding:10px 16px;border-width:2px}
input.big:focus{border-color:var(--accent);outline:none}
.sale{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,390px);gap:16px;align-items:start}
.side{display:grid;gap:12px;min-width:0}
.cartw{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:280px}
.crow{display:grid;grid-template-columns:minmax(0,1fr) 128px 120px 70px 88px 74px;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.crow.ch{background:var(--surface2);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding-block:8px}
.crow input{min-height:34px;padding:4px 8px;text-align:right}
.crow .cq{display:flex;gap:4px;align-items:center}.crow .cq input{text-align:center;width:50px;padding:4px}
.crow .ct{text-align:right;font-family:var(--font-head);font-weight:700;font-size:17px}
.crow .cn b{font-weight:600;overflow-wrap:anywhere;display:block}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cgrid .s2{grid-column:1/-1}
.change{padding:12px 16px;border-radius:12px;font-weight:700;font-size:17px;display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--surface2)}
.change b{font-family:var(--font-head);font-size:34px}
.change.ok{background:var(--ok-bg);color:var(--ok)}.change.bad{background:var(--bad-bg);color:var(--bad)}
input.bigin{font-size:26px;min-height:58px;font-weight:700;text-align:right}
details summary{cursor:pointer;font-weight:600;padding:6px 0}
.pkrow{display:flex;width:100%;justify-content:space-between;gap:12px;text-align:left;margin-bottom:6px;align-items:center}
.plist{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.prow{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,2.5fr) 76px 72px 64px;gap:14px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow.ph{background:var(--surface2);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding-block:8px}
.prow:not(.ph){cursor:pointer}.prow:not(.ph):hover{background:var(--surface2)}
.prow .pn b{display:block;font-weight:600;overflow-wrap:anywhere}
.pp{display:flex;gap:6px;flex-wrap:wrap}
.pr{display:inline-flex;flex-direction:column;min-width:66px;border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-weight:700;font-variant-numeric:tabular-nums;font-size:13px;line-height:1.25}
.pr i{font-style:normal;font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.prow .r{text-align:right}
@media(max-width:860px){
 .sale{grid-template-columns:1fr}
 .crow{grid-template-columns:1fr 1fr 1fr}.crow.ch{display:none}.crow .cn{grid-column:1/-1}.crow .ct{text-align:left}.crow .cx{text-align:right}
 .crow>div[data-l]::before{content:attr(data-l);display:block;font-size:10px;text-transform:uppercase;color:var(--muted);font-weight:700;letter-spacing:.05em}
 .prow{grid-template-columns:1fr 1fr 1fr}.prow.ph{display:none}.prow .pn,.prow .pp{grid-column:1/-1}.prow .r{text-align:left}
 .prow>div[data-l]::before{content:attr(data-l);display:block;font-size:10px;text-transform:uppercase;color:var(--muted);font-weight:700;letter-spacing:.05em}
}
@media(prefers-reduced-motion:no-preference){.toast{animation:tin .18s ease-out}@keyframes tin{from{opacity:0;transform:translateY(8px)}}}

/* versiones de pantalla: PC horizontal (estilo punto de venta clásico) y móvil vertical */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 16px;font-weight:600;font-size:13px;color:var(--muted);min-height:34px}
.seg button.on{background:var(--accent);color:var(--accent-fg)}
.lbl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-bottom:6px}
.pc{display:grid;gap:12px}
.pc-info{display:grid;grid-template-columns:230px minmax(0,1fr) 200px;gap:16px;align-items:start;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:14px}
.pc-no{display:grid;gap:10px}.pc-no span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;display:block}
.pc-no b{font-family:var(--font-head);font-size:20px}
.fkeys{display:flex;gap:8px;flex-wrap:wrap;background:var(--accent);border-radius:10px;padding:6px 10px;align-items:center}
.fkeys button{background:rgba(255,255,255,.18);color:var(--accent-fg);border:0;border-radius:6px;padding:4px 12px;font-weight:600;font-size:13px;min-height:30px}
.fkeys span{color:var(--accent-fg);opacity:.9;margin-left:auto;font-size:12px}
.pc .cartw{min-height:330px}
.pc-info .cgrid{grid-template-columns:repeat(4,minmax(0,1fr))}.pc-info .cgrid .s2{grid-column:span 2}.pc-info .panel{padding:12px}.pc-info .panel>div:first-child{margin-bottom:6px!important}
.ct2 th.r,.ct2 td.r{text-align:right}
.ct2 th{font-size:12px;color:var(--accent)}
.ct2 td{vertical-align:middle;white-space:normal}.ct2 td.nw{white-space:nowrap}
.tiers{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.tiers button{border:1px solid var(--line);background:var(--surface2);color:var(--muted);border-radius:99px;padding:2px 9px;font-size:12px;font-weight:600;min-height:0;line-height:1.5}
.tiers button:hover{border-color:var(--accent);color:var(--fg)}.tiers button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
.tbtn{display:none;border:1px solid var(--line);background:var(--surface2);color:var(--accent);border-radius:99px;padding:1px 9px;font-size:12px;font-weight:700;min-height:0;margin-left:6px;line-height:1.6}
body.m .tiers{display:none}body.m .tbtn{display:inline-block}
.sugt{font-size:11px;color:var(--muted)}body.m .sugt{display:none}
.ct2 input{min-height:34px;padding:4px 8px;text-align:right;width:92px}
.ct2 .cq{display:flex;gap:4px;align-items:center;justify-content:flex-end}.ct2 .cq input{width:52px;text-align:center}
.pc-foot{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,460px);gap:16px;align-items:end}

function priceFor(p,li){const v=p.p[li];return v>0?v:(p.p[0]||0)}
const tierThr=(p,i)=>i===1?S.cfg.t2:i===2?(p.dn>0?p.dn:S.cfg.t3):i===3?(p.bulto||0):i===5?(p.cn||0):1;
const packN=(p,i)=>i===2?(p.dn>0?p.dn:S.cfg.t3):i===3?(p.bulto||0):i===5?(p.cn||0):1;
const r6=x=>Math.round((x+Number.EPSILON)*1e6)/1e6;
function tierIdx(p,qty,li){if(li===-2){let b=0,m=Infinity;p.p.forEach((v,i)=>{if(v>0&&v<m){m=v;b=i}});return b}if(li>=0)return li;let b=0,bt=0,bp=p.p[0]||0;for(const i of [1,2,3,5]){const t=tierThr(p,i);if(t>0&&p.p[i]>0&&qty>=t&&(t>bt||(t===bt&&p.p[i]<bp))){b=i;bt=t;bp=p.p[i]}}return b}
function priceQty(p,qty,li){return priceFor(p,tierIdx(p,qty,li))}
function reprice(l){if(l.manual)return;const p=prod(l.pid);if(p)l.price=priceQty(p,l.qty,S.cart.list)}
function totalsFor(lines,gd){
  lines=applyPromos(lines);
  const rate=S.cfg.ivaRate/100,inc=S.cfg.incIva;let g0=0,gI=0,raw=0,all=0;const out=[];
  for(const l of lines){
    const rw=l.qty*l.price;raw+=rw;const g=r2(rw*(1-(l.disc||0)/100)*(1-(gd||0)/100));all+=g;
    let b=g,t=0;if(l.iva){if(inc){b=r2(g/(1+rate));t=r2(g-b)}else{t=r2(g*rate)}gI+=g}else g0+=g;
    out.push({...l,b,t,tot:r2(b+t)});
  }
  let sub0=r2(g0),subIva,iva,total;
  if(inc){const tI=r2(gI);subIva=r2(tI/(1+rate));iva=r2(tI-subIva);total=r2(sub0+tI)}
  else{subIva=r2(gI);iva=r2(subIva*rate);total=r2(sub0+subIva+iva)}
  return {sub0,subIva,iva,disc:r2(raw-all),total,lines:out};
}
const cartLines=()=>S.cart.lines.map(l=>{const p=prod(l.pid);return {...l,iva:!!(p&&p.iva),code:p?p.code:'',name:l.nm||(p?p.name:'(eliminado)'),cost:p?p.cost:0}}).filter(l=>prod(l.pid));
const curTotals=()=>totalsFor(cartLines(),S.cart.gd);

function cedulaOk(c){if(!/^\d{10}$/.test(c))return false;const p=+c.slice(0,2);if(!((p>=1&&p<=24)||p===30))return false;if(+c[2]>5)return false;
  let s=0;for(let i=0;i<9;i++){let v=+c[i]*(i%2===0?2:1);if(v>9)v-=9;s+=v}return (10-s%10)%10===+c[9]}
function rucOk(r){if(!/^\d{13}$/.test(r))return false;const p=+r.slice(0,2);if(!((p>=1&&p<=24)||p===30))return false;const t=+r[2];
  if(t<6)return cedulaOk(r.slice(0,10))&&r.slice(10)!=='000';
  const calc=(co,pos)=>{let s=0;co.forEach((c,i)=>s+=+r[i]*c);let d=11-s%11;if(d===11)d=0;return d<10&&d===+r[pos]};
  if(t===9)return calc([4,3,2,7,6,5,4,3,2],9)&&r.slice(10)!=='000';
  if(t===6)return calc([3,2,7,6,5,4,3,2],8)&&r.slice(9)!=='0000';
  return false}

function identErr(tipo,id){id=String(id||'').trim();if(tipo==='cf')return '';if(!id)return 'Ingrese la identificación.';
  if(tipo==='cedula'&&!/^\d{10}$/.test(id))return 'La cédula debe tener 10 dígitos.';
  if(tipo==='ruc'&&!/^\d{13}$/.test(id))return 'El RUC debe tener 13 dígitos.';return ''}
const cleanId=v=>String(v||'').replace(/[\s.\-]/g,'');
function identWarn(tipo,id){return (tipo==='cedula'&&!cedulaOk(id))||(tipo==='ruc'&&!rucOk(id))?'Dígito verificador no coincide (revise)':''}

function handleScan(v){

  if(!f.length){toast('No se encontró: '+v,1);const bx2=$('#sugg');if(bx2)bx2.innerHTML=`<div class="muted small" style="padding:4px 2px">No existe «${esc(v)}».</div><button class="btn sm pri" data-act="newProdFromSale" data-q="${esc(v)}">＋ Crear producto nuevo</button>`;return}

function code128(txt){txt=String(txt);const dig=/^\d+$/.test(txt)&&txt.length%2===0;let v;

  else{v=[104];for(const ch of txt){const c=ch.charCodeAt(0);if(c<32||c>126)return null;v.push(c-32)}}
  let sum=v[0];for(let i=1;i<v.length;i++)sum+=v[i]*i;v.push(sum%103,106);return v.map(x=>C128[x]).join('')}

function voidSale(id){const s=S.sales.find(x=>x.id===id);if(!s||s.status!=='ok')return;

function prodList(){

    <div class="pc2-pr">${chips}</div><div class="pc2-ft"><span>Costo <b>${money(p.cost)}</b></span>${m==null?'':`<span class="pill ${m<0?'bad':m<25?'warn':'ok'}">Margen ${m.toFixed(0)}%</span>`}${p.iva?`<span class="pill">IVA ${S.cfg.ivaRate}%</span>`:''}${p.active?'':'<span class="pill bad">inactivo</span>'}</div></div>`}).join('');

function tierLabel(i){const n=S.cfg.listNames[i];return i===1?`${n} (desde ${S.cfg.t2} u.)`:i===2?`${n} (desde ${S.cfg.t3} u.)`:i===3?`${n} (por bulto)`:i===5?`${n} (por caja)`:i===4?`${n} (comerciantes, solo si se elige)`:n}
const tierWhen=i=>i===5?'Al llevar 1 caja completa':i===0?'Desde 1 unidad':i===1?`Desde ${S.cfg.t2} unidades`:i===2?`Desde ${S.cfg.t3} unidades`:i===3?'Al llevar 1 bulto completo':'⭐ Solo clientes aliados';
function lineOpts(cur){const L=[...new Set(S.products.map(x=>(x.line||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));cur=(cur||'').trim();if(cur&&!L.includes(cur))L.unshift(cur);

function lineVal(){const v=$('#e_line').value;return v==='__new'?$('#e_newline').value.trim():v}
const PK_I=[2,3,5];
function pkRow(p,i){const n=packN(p,i),idn=i===2?'e_dn':i===3?'e_bulto':'e_cn',v=p.p[i]>0&&n>0?r6(p.p[i]*n):'';
  return `<div class="pt-r pt-${i}"><div class="pt-t"><b>${esc(S.cfg.listNames[i])}</b><small>Unidades que trae y precio de la ${esc(S.cfg.listNames[i].toLowerCase())} completa</small></div><div class="pt-i pk-i"><input id="${idn}" type="number" step="1" min="0" value="${n||''}" placeholder="u." data-inp="margin" aria-label="Unidades por ${esc(S.cfg.listNames[i])}"><span>u. · $</span><input id="e_pp${i}" type="number" step="any" min="0" value="${v}" data-inp="margin" aria-label="Precio de la ${esc(S.cfg.listNames[i])}"></div><div class="pt-m" id="m_p${i}"></div></div>`}
function uPrice(i){if(!PK_I.includes(i))return num(($('#e_p'+i)||{}).value);const n=num(($('#'+(i===2?'e_dn':i===3?'e_bulto':'e_cn'))||{}).value),pp=num(($('#e_pp'+i)||{}).value);return n>0&&pp>0?pp/n:0}
function editProd(id){

   <label class="f">Código de barras / interno<input id="e_code" value="${esc(p.code)}" ${id?'':'autofocus'}></label><label class="f" style="grid-column:span 2">Descripción<input id="e_name" value="${esc(p.name)}"></label>

   <div class="bar" style="margin:0;gap:8px"><button type="button" class="btn sm" data-act="genCode">🔢 Generar código</button><button type="button" class="btn sm" data-act="barLabel">🏷 Etiqueta con código de barras</button></div>

   <div class="ptab">${[0,1,2,5,3,4].map(i=>PK_I.includes(i)?pkRow(p,i):`<div class="pt-r pt-${i}"><div class="pt-t"><b>${esc(S.cfg.listNames[i])}</b><small>${tierWhen(i)}</small></div><div class="pt-i"><span>$</span><input id="e_p${i}" type="number" step="any" min="0" value="${p.p[i]||0}" data-inp="margin" aria-label="${esc(S.cfg.listNames[i])}"></div><div class="pt-m" id="m_p${i}"></div></div>`).join('')}</div>

   <div><label class="f">Proveedor (opcional)<select id="e_sup">${supOpts(p.supplier)}</select></label><div style="display:flex;gap:6px;margin-top:6px"><input id="e_newsup" placeholder="Agregar proveedor nuevo" style="min-height:34px"><button class="btn sm" data-act="addSupInline" style="white-space:nowrap">Agregar</button></div></div>
   <div style="display:grid;gap:8px"><label class="ck"><input type="checkbox" id="e_iva" ${p.iva?'checked':''}> Cobra IVA ${S.cfg.ivaRate}% <span class="muted small">(opcional; en RIMPE déjelo sin marcar)</span></label><label class="ck"><input type="checkbox" id="e_active" ${p.active?'checked':''}> Disponible para la venta</label><label class="ck"><input type="checkbox" id="e_track" ${p.track?'checked':''}> Controlar inventario</label></div>
   <div class="fgrid"><label class="f">${id?'Stock actual (use Inventario para ajustar)':'Stock inicial'}<input id="e_stock" type="number" step="1" value="${p.stock}" ${id?'disabled':''}></label><label class="f">Stock mínimo (alerta)<input id="e_min" type="number" step="1" min="0" value="${p.min||0}"></label></div>

function margin(){const c=num($('#e_cost').value);for(let i=0;i<6;i++){const q=uPrice(i),m=$('#m_p'+i);if(m)m.textContent=q>0?(PK_I.includes(i)?pmoney(q)+' c/u'+(c>0?' · ':''):'')+(c>0?((q-c)/q*100).toFixed(0)+'%':''):'';if(m)m.className='pt-m'+(q>0&&q<=c?' neg':'')}const p=num($('#e_p0').value),el=$('#mg');if(!el)return;el.textContent=p>0?`Margen en precio unidad: ${((p-c)/p*100).toFixed(1)}% · ganancia ${money(p-c)} por unidad`:'Sin precio de venta.'}
function saveProd(id){
  const code=$('#e_code').value.trim(),name=$('#e_name').value.trim().toUpperCase();if(!code||!name)return toast('Código y descripción son obligatorios.',1);
  if(S.products.some(p=>p.code.toLowerCase()===code.toLowerCase()&&p.id!==id))return toast('Ya existe un producto con ese código.',1);
  const d={code,name,line:lineVal(),cost:num($('#e_cost').value),p:[0,1,2,3,4,5].map(i=>uPrice(i)),dn:Math.max(0,Math.floor(num($('#e_dn').value))),cn:Math.max(0,Math.floor(num($('#e_cn').value))),iva:$('#e_iva').checked,active:$('#e_active').checked,track:$('#e_track').checked,min:num($('#e_min').value),bulto:Math.max(0,Math.floor(num($('#e_bulto').value))),boxCode:$('#e_box').value.trim(),supplier:$('#e_sup').value};
  for(const [i,nm,u] of [[2,'docena',d.dn],[3,'bulto',d.bulto],[5,'caja',d.cn]])if(num($('#e_pp'+i).value)>0&&!(u>0))return toast('Indique cuántas unidades trae la '+nm+'.',1);
  if(d.boxCode){if(d.bulto<1)return toast('Para usar código de caja indique las unidades por bulto.',1);if(d.boxCode.toLowerCase()===code.toLowerCase()||S.products.some(x=>x.id!==id&&(x.code.toLowerCase()===d.boxCode.toLowerCase()||(x.boxCode||'').toLowerCase()===d.boxCode.toLowerCase())))return toast('Ese código de caja ya está usado por otro producto.',1)}
  if(id)Object.assign(prod(id),d);else{const np={id:'p'+uid(),stock:0,...d};np.stock=num($('#e_stock').value);S.products.push(np);if(pendingAdd){pendingAdd=false;S._add=np}if(np.track&&np.stock)S.moves.push({id:uid(),ts:Date.now(),pid:np.id,name:np.name,type:'ajuste',qty:np.stock,ref:'Stock inicial'})}
  save(true);const _a=S._add;delete S._add;closeModal();toast('Producto guardado.');render();if(_a){addToCart(_a,1);toast('Producto creado y agregado a la venta.')}}
function bulkModal(){modal(`${dlgHead('Acciones masivas')}<p class="muted" style="margin:0">Se aplican a todos los productos activos.</p>

const nk=h=>norm(h).replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const numX=v=>{if(typeof v==='number')return v;let t=String(v??'').replace(/[^\d.,-]/g,'');if(t.includes(',')&&t.includes('.'))t=t.replace(/\./g,'').replace(',','.');else t=t.replace(',','.');const n=parseFloat(t);return isNaN(n)?0:n};
function impGuess(H){const used=new Set(),g={},hs=H.map(nk);
  for(const [k,,syn] of IMPF){const i=hs.findIndex((h,i)=>!used.has(i)&&syn.some(x=>nk(x)===h));if(i>=0){g[k]=i;used.add(i)}}
  for(const [k,,syn] of IMPF){if(g[k]!=null)continue;const i=hs.findIndex((h,i)=>!used.has(i)&&h&&syn.some(x=>{x=nk(x);return x.length>=4&&h.includes(x)}));if(i>=0){g[k]=i;used.add(i)}}
  return g}

function cashStats(ses){
  let by={efectivo:0,tarjeta:0,transferencia:0,qr:0,credito:0},n=0,ab=0;
  for(const s of S.sales){if(s.sessionId===ses.id&&s.status==='ok'){n++;for(const p of s.pays)by[p.m]+=p.amt;by.efectivo-=s.change||0}
    if(s.status==='ok')for(const a of s.abonos||[])if(a.sessionId===ses.id){if(a.m==='efectivo')ab+=a.amt;else by[a.m]+=a.amt}}
  const ing=(ses.moves||[]).filter(m=>m.type==='ingreso').reduce((a,m)=>a+m.amt,0),egr=(ses.moves||[]).filter(m=>m.type==='egreso').reduce((a,m)=>a+m.amt,0);
  const rc=S.sales.reduce((a,v)=>a+(v.status==='ok'?(v.rets||[]).filter(r=>r.sessionId===ses.id).reduce((b,r)=>b+r.cash,0):0),0);return {by,n,ab:r2(ab),ing:r2(ing),egr:r2(egr+rc),expected:r2(ses.fondo+by.efectivo+ab+ing-egr-rc)}}

const LGT={venta:'Venta',abono:'Cobro de crédito',ingreso:'Ingreso',retiro:'Retiro',gasto:'Gasto',devolucion:'Devolución',transfer:'Transferencia',ajuste:'Ajuste',saldo_ini:'Saldo inicial',anulacion:'Anulación',aprobado:'Aprobado'};
const ACC={caja:'Caja',banco:'Banco',ahorro:'Ahorros',porconfirmar:'Por confirmar'};
function lgMigrate(){if(!Array.isArray(S.ledger))S.ledger=[];if(S.ledgerV)return;
  let v=0;if(S.caja)v=cashStats(S.caja).expected;else if(S.cajaHist.length)v=S.cajaHist[S.cajaHist.length-1].counted||0;
  v=r2(v);if(v&&!S.ledger.length)S.ledger.push({id:'mig-caja-'+DEV,ts:Date.now(),d:dkey(Date.now()),acc:'caja',amt:v,type:'saldo_ini',concept:'Saldo inicial (traído del sistema anterior)',ref:'',sid:S.caja?S.caja.id:null,by:''});
  S.ledgerV=1}
function cajaWire(){if(!S.cajas||typeof S.cajas!=='object')S.cajas={};
  const d=Object.getOwnPropertyDescriptor(S,'caja');
  if(d&&!d.get){const c=S.caja;delete S.caja;if(c){c.u=c.u===undefined?(c.who||S.cfg.cur||''):c.u;if(!S.cajas[c.u])S.cajas[c.u]=c}}
  if(!(Object.getOwnPropertyDescriptor(S,'caja')||{}).get)Object.defineProperty(S,'caja',{enumerable:false,configurable:true,get(){return this.cajas[(this.cfg&&this.cfg.cur)||'']||null},set(v){const k=(this.cfg&&this.cfg.cur)||'';if(v)this.cajas[k]=v;else delete this.cajas[k]}});
  if(!S.ledgerU2){S.ledger.forEach(e=>{if(e.type==='saldo_ini'&&!e.u)e.u=S.cfg.cur||''});S.ledgerU2=1}}
function lgTag(){if(!Array.isArray(S.ledger)||S.ledgerU)return;S.ledger.forEach(e=>{if(e.dev===undefined)e.dev=DEV;if(e.u===undefined)e.u=e.by||''});S.ledgerU=1}

const SK=['products','customers','suppliers','sales','moves','expenses','promos'];
function hsh(o,sk){const s=JSON.stringify(o,(k,v)=>k==='_u'||(sk&&k==='stock')?undefined:v);let h=5381;for(let i=0;i<s.length;i++)h=(h*33^s.charCodeAt(i))>>>0;return h.toString(36)+s.length}
function sHdr(){const h={apikey:S.cfg.syncKey,'Content-Type':'application/json'};if(S.cfg.syncKey.startsWith('eyJ'))h.Authorization='Bearer '+S.cfg.syncKey;return h}
function markDel(k,id){if(!S.cfg.syncUrl)return;const sy=S.sync=S.sync||{h:{},cur:null,started:false};sy.del=sy.del||{};sy.del[k+':'+id]=Date.now()}
function sStamp(){const sy=S.sync;for(const k of SK){if(k==='moves')continue;for(const o of S[k])if(sy.h[k+':'+o.id]!==hsh(o,k==='products'))o._u=Date.now()}}
function sApply(k,x){
  const sy=S.sync,key=x.id,id=key.slice(k.length+1),d=x.data,sk=k==='products';
  if(k==='moves'){if(id.startsWith(DEV+'-')||S.moves.some(m=>m.id===id))return 0;
    d._u=x.u;S.moves.push(d);sy.h[key]=hsh(d);const p=prod(d.pid);if(p&&p.track)p.stock=r2(p.stock+d.qty);return 1}
  const dl=(S.sync.del||{})[key];
  if(d&&d._del){const j=S[k].findIndex(o=>o.id===id);if(j>=0)S[k].splice(j,1);sy.h[key]='del';return j>=0?1:0}
  if(dl&&(x.u||0)<=dl)return 0;
  d._u=x.u;const arr=S[k],i=arr.findIndex(o=>o.id===id);
  if(i<0){if(sk)d.stock=0;arr.push(d);sy.h[key]=hsh(d,sk);return 1}
  const l=arr[i],lh=hsh(l,sk);
  if(lh===hsh(d,sk)){sy.h[key]=lh;return 0}
  if(sy.started&&sy.h[key]!==lh&&(l._u||0)>(x.u||0))return 0;
  if(sk)d.stock=l.stock;arr[i]=d;sy.h[key]=hsh(d,sk);return 1}
function sFetch(u,o){const c=new AbortController(),t=setTimeout(()=>c.abort(),20000);return fetch(u,{...o,signal:c.signal}).finally(()=>clearTimeout(t))}
function sRows(rows){const sy=S.sync;let ch=0;
    for(const k of SK)for(const x of rows)if(x.kind===k)ch+=sApply(k,x);
    for(const x of rows)if(x.kind==='sellers'){const M=S.cfg.sellMeta=S.cfg.sellMeta||{},rm=x.data.meta||{};
      for(const n of x.data.list||[])if(!S.sellers.includes(n)&&!(M[n]&&M[n].d)){S.sellers.push(n);ch++}
      for(const n in rm){const l=M[n],r=rm[n];if(l&&l.t>=r.t)continue;M[n]=r;const i=S.sellers.indexOf(n);
        if(r.d){if(i>=0){S.sellers.splice(i,1);S.cfg.recentSellers=(S.cfg.recentSellers||[]).filter(y=>y!==n);if(S.cfg.cur===n)S.cfg.cur='';ch++}}else if(i<0){S.sellers.push(n);ch++}}
      if(x.data.pins){const P=S.cfg.pins=S.cfg.pins||{},T=S.cfg.pinT=S.cfg.pinT||{},rt=x.data.pinT||{};for(const k in x.data.pins){if(!(k in P)||(rt[k]||0)>(T[k]||0)){if(P[k]!==x.data.pins[k])ch++;P[k]=x.data.pins[k];T[k]=rt[k]||0}}}if(x.data.bancoUsers)S.cfg.bancoUsers=Object.assign({},S.cfg.bancoUsers,x.data.bancoUsers);if(x.data.prof&&(x.data.prof.t||0)>((S.cfg.prof||{}).t||0)){S.cfg.prof=x.data.prof;ch++}if(x.data.alias)S.cfg.alias=Object.assign({},x.data.alias,S.cfg.alias||{});sy.h['sellers:all']=hsh([S.sellers,S.cfg.pins||{},S.cfg.pinT||{},M,S.cfg.bancoUsers||{},S.cfg.prof||{},S.cfg.alias||{}])}
    ch+=sRowsLg(rows);try{ch+=applyAlias()}catch(e){}
  return ch}
/* 6B-2: libro y cierres, solo se AGREGAN por id (nunca se sobrescribe ni se borra) */
function sRowsLg(rows){const sy=S.sync;let ch=0;sy.lg=sy.lg||{};if(!Array.isArray(S.ledger))S.ledger=[];
  for(const x of rows){if(!x||!x.data||!x.data.id)continue;const d=x.data;
    if(x.kind==='hb'){hbApply(d);continue}
    if(x.kind==='ledger'){if(sy.lg[d.id])continue;if(!S.ledger.some(e=>e.id===d.id)){S.ledger.push(d);ch++}sy.lg[d.id]=1}
    else if(x.kind==='cajaopen'){if(sy.lg['o:'+d.id])continue;sy.lg['o:'+d.id]=1;const u=d.u||'';
      if(!S.cajaHist.some(h=>h.id===d.id)&&!S.cajas[u]){S.cajas[u]=d;ch++}}
    else if(x.kind==='cajahist'){if(sy.lg['h:'+d.id])continue;if(!S.cajaHist.some(h=>h.id===d.id)){S.cajaHist.push(d);S.cajaHist.sort((a,b)=>a.closeTs-b.closeTs);ch++}sy.lg['h:'+d.id]=1}}
  for(const u of Object.keys(S.cajas))if(S.cajaHist.some(h=>h.id===S.cajas[u].id)){delete S.cajas[u];ch++}
  return ch}
function sOutLg(){const sy=S.sync,out=[];sy.lg=sy.lg||{};
  for(const e of S.ledger)if(!sy.lg[e.id])out.push({k:e.id,row:{id:'ledger:'+e.id,kind:'ledger',data:e,u:e.ts,dev:DEV}});
  for(const h of S.cajaHist)if(!sy.lg['h:'+h.id])out.push({k:'h:'+h.id,row:{id:'cajahist:'+h.id,kind:'cajahist',data:h,u:h.closeTs,dev:DEV}});
  for(const u in S.cajas){const c=S.cajas[u];if(!sy.lg['o:'+c.id])out.push({k:'o:'+c.id,row:{id:'cajaopen:'+c.id,kind:'cajaopen',data:{...c,u},u:c.ts,dev:DEV}})}
  return out}
async function sPushLg(){const out=sOutLg(),sy=S.sync;
  for(let i=0;i<out.length;i+=100){const c=out.slice(i,i+100);
    const r=await sFetch(S.cfg.syncUrl+'/rest/v1/records?on_conflict=id',{method:'POST',headers:{...sHdr(),Prefer:'resolution=ignore-duplicates,return=minimal'},body:JSON.stringify(c.map(x=>x.row))});
    if(!r.ok)throw new Error('envío libro '+r.status);
    c.forEach(x=>sy.lg[x.k]=1)}
  return out.length}
async function sPull(){
  const sy=S.sync;let ch=0,n=0;
  for(;;){
    const q=sy.cur?'&srv=gte.'+encodeURIComponent(sy.cur):'';
    const r=await sFetch(S.cfg.syncUrl+'/rest/v1/records?select=id,kind,data,u,srv&order=srv.asc&limit=1000&kind=neq.snap'+q,{headers:sHdr()});
    if(!r.ok)throw new Error('descarga '+r.status);
    const rows=await r.json();n+=rows.length;
    ch+=sRows(rows);
    const same=rows.length&&rows[rows.length-1].srv===sy.cur;
    if(rows.length)sy.cur=rows[rows.length-1].srv;
    if(rows.length<1000||same)break}
  if(sy.started&&sy.ok){const since=Math.max(0,sy.ok-18e5);
    for(let off=0;;off+=1000){const r=await sFetch(S.cfg.syncUrl+'/rest/v1/records?select=id,kind,data,u,srv&kind=neq.snap&u=gte.'+since+'&order=u.asc,id.asc&limit=1000&offset='+off,{headers:sHdr()});
      if(!r.ok)throw new Error('descarga '+r.status);const rows=await r.json();ch+=sRows(rows);if(rows.length<1000)break}}
  return {ch,n}}
async function sPush(){
  const sy=S.sync,out=[];
  for(const k of SK)for(const o of S[k]){const key=k+':'+o.id,h=hsh(o,k==='products');if(sy.h[key]!==h)out.push({key,h,row:{id:key,kind:k,data:o,u:o._u||o.ts||0,dev:DEV}})}
  for(const key in (sy.del||{})){if(sy.h[key]==='del')continue;const p=key.indexOf(':'),k=key.slice(0,p),id=key.slice(p+1);out.push({key,h:'del',row:{id:key,kind:k,data:{id,_del:1},u:sy.del[key],dev:DEV}})}
  const sh=hsh([S.sellers,S.cfg.pins||{},S.cfg.pinT||{},S.cfg.sellMeta||{},S.cfg.bancoUsers||{},S.cfg.prof||{},S.cfg.alias||{}]);if(sy.h['sellers:all']!==sh)out.push({key:'sellers:all',h:sh,row:{id:'sellers:all',kind:'sellers',data:{list:S.sellers,pins:S.cfg.pins||{},pinT:S.cfg.pinT||{},meta:S.cfg.sellMeta||{},bancoUsers:S.cfg.bancoUsers||{},prof:S.cfg.prof||{},alias:S.cfg.alias||{}},u:Date.now(),dev:DEV}});
  for(let i=0;i<out.length;i+=25){const c=out.slice(i,i+25);
    const r=await sFetch(S.cfg.syncUrl+'/rest/v1/records?on_conflict=id',{method:'POST',headers:{...sHdr(),Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(c.map(x=>x.row))});
    if(!r.ok)throw new Error('envío '+r.status);
    c.forEach(x=>sy.h[x.key]=x.h)}
  return out.length}
async function runSync(manual){
  if(SY.busy)return;
  if(!S.cfg.syncUrl||!S.cfg.syncKey){if(manual)toast('Primero configure la nube.',1);return}
  if(S.cfg.offline||!navigator.onLine){if(manual)toast('Sin internet o en modo sin internet.',1);return}
  SY.busy=true;SY.msg='Sincronizando…';headState();let res;
  try{
    S.sync=S.sync||{h:{},cur:null,started:false};const sy=S.sync;
    if(sy.started)sStamp();else for(const m of S.moves)sy.h['moves:'+m.id]=hsh(m);
    const t0=Date.now(),{ch,n}=await sPull();
    if(!sy.started){
      if(!n)for(const p of S.products)if(p.track&&p.stock)S.moves.push({id:uid(),ts:Date.now(),pid:p.id,name:p.name,type:'ajuste',qty:p.stock,ref:'Saldo al sincronizar'});
      sy.started=true}
    sStamp();const sent=await sPush()+await sPushLg();if(S.cfg.lastSnap!==today())snapPush();
    sy.ok=t0;S.cfg.lastOk=Date.now();S.cfg.netGrace=false;netSeen(1);try{await hbPush()}catch(e){}SY.msg='✓ '+new Date().toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit'});
    res={ch,sent}}
  catch(e){SY.msg='Error: '+e.message;if(manual)toast('No se pudo sincronizar ('+e.message+')',1)}
  save(true);SY.busy=false;headState();
  if(res){if(res.ch&&$('#modal').hidden)render();if(manual)toast('Sincronizado ✓')}}

var CR={f:'open',q:'',photo:'',from:''};
function crSales(cid,all){return S.sales.filter(s=>s.customerId===cid&&s.status==='ok'&&s.credit&&(all||s.balance>0)).sort((a,b)=>a.ts-b.ts)}
function crPaid(s){return r2((s.abonos||[]).reduce((a,x)=>a+x.amt,0))}
function crOrig(s){return r2(s.balance+crPaid(s))}
function crOverDays(s){return Math.max(1,Math.round((dayStart(today())-dayStart(s.due))/864e5))}
function crOver(s){return s.status==='ok'&&s.balance>0&&!!s.due&&s.due<today()}
function crClients(){
  const ids=[...new Set(S.sales.filter(s=>s.status==='ok'&&s.credit).map(s=>s.customerId))];
  return ids.map(id=>{const L=crSales(id,true),open=L.filter(s=>s.balance>0);return {c:cust(id),L,open,debt:r2(open.reduce((a,s)=>a+s.balance,0)),orig:r2(open.reduce((a,s)=>a+crOrig(s),0)),over:open.filter(crOver)}}).filter(x=>x.c)}

function crList(){

function expRoll(){const m=today().slice(0,7);let ch=0;for(const e of S.expenses.filter(x=>x.rec&&!x.src&&!x.del)){let k=e.date.slice(0,7);while(k<m){const d=new Date(k+'-01T12:00:00');d.setMonth(d.getMonth()+1);k=d.toISOString().slice(0,7);const id='r'+e.id+'-'+k;if(!S.expenses.some(x=>x.id===id)){S.expenses.push({...e,id,src:e.id,rec:false,pay:'',date:k+'-'+String(Math.min(+e.date.slice(8),28)).padStart(2,'0')});ch++}}}if(ch)save(true)}
function expModal(pre){const L=S.expenses.filter(e=>!e.del&&e.date>=R.f&&e.date<=R.t).sort((a,b)=>b.date.localeCompare(a.date));
  modal(`${dlgHead('Gastos del negocio')}<div class="fgrid"><label class="f">Concepto<select id="ex_c">${EXC.map(c=>`<option>${c}</option>`).join('')}</select></label><label class="f">Monto<input id="ex_a" inputmode="decimal" autocomplete="off"></label><label class="f">Fecha<input id="ex_d" type="date" value="${today()}"></label><label class="f">Se pagó desde<select id="ex_p"><option value="caja" ${pre!=='banco'&&pre!==''?'selected':''}>Caja (efectivo)</option><option value="banco" ${pre==='banco'?'selected':''}>Banco</option><option value="" ${pre===''?'selected':''}>No descontar de ninguno</option></select></label></div><label class="f">Motivo o descripción<input id="ex_n" placeholder="Ej: COMPRA DE FUNDAS"></label><label style="display:flex;gap:8px;align-items:center;margin:8px 0"><input id="ex_r" type="checkbox" style="width:auto"> Se repite cada mes (arriendo, sueldos…)</label><div class="ft" style="justify-content:flex-start"><button class="btn pri" data-act="expAdd">Guardar gasto</button></div><h4 class="tsec">${R.f} a ${R.t}</h4>${L.length?`<table><tbody>${L.map(e=>`<tr><td>${e.date}</td><td>${esc(e.cat)}${e.n?' · '+esc(e.n):''}${e.rec?' 🔁':''}${e.pay?` <span class="pill">${e.pay==='banco'?'Banco':'Caja'}</span>`:''}</td><td class="r money">${money(e.amt)}</td><td><button class="btn sm bad" data-act="expDel" data-id="${e.id}">✕</button></td></tr>`).join('')}</tbody></table>`:'<div class="muted small">Sin gastos en este período.</div>'}`,1)}

const CB={f:today(),t:today(),auto:true};
const crCred=s=>r2(s.total-s.pays.reduce((a,p)=>a+p.amt,0)+(s.change||0));
function crAbonos(f,t){const a=dayStart(f),b=dayEnd(t),o=[];
  for(const s of S.sales){if(s.status!=='ok'||!s.credit)continue;let run=crCred(s);
    (s.abonos||[]).forEach((x,i)=>{run=r2(run-x.amt);if(x.ts>=a&&x.ts<=b)o.push({ts:x.ts,s,x,cid:s.customerId,saldoVenta:run})})}
  return o.sort((p,q)=>q.ts-p.ts)}
function vCobrados(){
  if(CB.auto){CB.f=CB.t=today()}
  $('#view').innerHTML=`<div class="bar"><h2 style="margin-right:auto">Créditos cobrados</h2><div class="seg">${[['hoy','Hoy'],['ayer','Ayer'],['7','7 días'],['mes','Mes']].map(([k,n])=>`<button data-act="cbRng" data-k="${k}">${n}</button>`).join('')}</div><label class="f">Desde<input type="date" id="cb_f" value="${CB.f}" data-chg="cobr"></label><label class="f">Hasta<input type="date" id="cb_t" value="${CB.t}" data-chg="cobr"></label></div><div id="cbbody"></div>`;cbBody()}
function cbBody(){
  CB.f=$('#cb_f').value||CB.f;CB.t=$('#cb_t').value||CB.t;
  const L=crAbonos(CB.f,CB.t),tot=r2(L.reduce((a,o)=>a+o.x.amt,0)),ef=r2(L.filter(o=>o.x.m==='efectivo').reduce((a,o)=>a+o.x.amt,0)),bk=r2(tot-ef);
  const by={};for(const o of L){(by[o.cid]=by[o.cid]||{n:0,amt:0}).amt=r2(by[o.cid].amt+o.x.amt);by[o.cid].n++}
  $('#cbbody').innerHTML=`<div class="tiles"><div class="tile-s"><span>Recuperado de créditos</span><b class="money">${money(tot)}</b></div><div class="tile-s"><span>Clientes que pagaron</span><b>${Object.keys(by).length}</b></div><div class="tile-s"><span>En efectivo → Caja</span><b class="money">${money(ef)}</b></div><div class="tile-s"><span>Por banco → Banco</span><b class="money">${money(bk)}</b></div><div class="tile-s"><span>Aún les deben</span><b class="money">${money(r2(Object.keys(by).reduce((a,id)=>a+debt(id),0)))}</b></div></div>
  <p class="muted small" style="margin:0 0 10px">Estos pagos no son ventas nuevas ni suman a las ventas del día; solo reducen la deuda y entran a Caja o Banco.</p>
  ${L.length?`<h4 class="tsec">Por cliente</h4><div class="tblw"><table><thead><tr><th>Cliente</th><th class="r">Pagos</th><th class="r">Pagó</th><th class="r">Saldo pendiente</th></tr></thead><tbody>${Object.keys(by).map(id=>`<tr class="click" data-act="crOpen" data-id="${id}"><td>${esc((cust(id)||{}).name||'')}</td><td class="r">${by[id].n}</td><td class="r money">${money(by[id].amt)}</td><td class="r money">${money(debt(id))}</td></tr>`).join('')}</tbody></table></div>
  <h4 class="tsec">Detalle de pagos</h4><div class="tblw"><table><thead><tr><th>Fecha</th><th>Cliente</th><th>Deuda que pagó</th><th>Forma</th><th class="r">Monto</th><th class="r">Saldo de esa deuda</th><th>Recibió</th></tr></thead><tbody>${L.map(o=>`<tr><td>${fmtDT(o.ts)}</td><td>${esc(o.s.custName)}</td><td>${esc(o.s.num)} · ${fmtDT(o.s.ts).slice(0,10)}</td><td>${esc(PAY[o.x.m]?PAY[o.x.m].n:o.x.m)} <span class="muted small">→ ${o.x.m==='efectivo'?'Caja':'Banco'}</span></td><td class="r money">${money(o.x.amt)}</td><td class="r money">${money(o.saldoVenta)}</td><td>${esc(o.x.by||'')}</td></tr>`).join('')}</tbody></table></div>`:empty('No hubo cobros de créditos en este período.')}`}
function histCred(){
  const q=norm(H.q),a=dayStart(H.f),b=dayEnd(H.t),OK=S.sales.filter(s=>s.status==='ok');
  const inR=OK.filter(s=>s.ts>=a&&s.ts<=b),cont=inR.filter(s=>!s.credit),cr=inR.filter(s=>s.credit&&(!q||norm(s.num+' '+s.custName+' '+s.custIdent).includes(q))).sort((x,y)=>y.ts-x.ts);
  const otorg=r2(cr.reduce((x,s)=>x+crCred(s),0)),cobr=r2(crAbonos(H.f,H.t).reduce((x,o)=>x+o.x.amt,0)),pend=r2(OK.filter(s=>s.credit).reduce((x,s)=>x+Math.max(0,s.balance),0));
  $('#hbody').innerHTML=`<div class="tiles"><div class="tile-s"><span>Ventas cobradas (contado)</span><b class="money">${money(r2(cont.reduce((x,s)=>x+s.total,0)))}</b></div><div class="tile-s"><span>Créditos otorgados (${cr.length})</span><b class="money">${money(otorg)}</b></div><div class="tile-s"><span>Créditos cobrados en el período</span><b class="money">${money(cobr)}</b></div><div class="tile-s"><span>Pendiente de cobro (total)</span><b class="money">${money(pend)}</b></div></div>
  <p class="muted small" style="margin:0 0 10px">Lo vendido a crédito no es dinero en Caja ni en Banco hasta que el cliente paga. «Pendiente de cobro» es lo que los clientes deben hoy, de todos los créditos.</p>
  <div class="tblw">${cr.length?`<table><thead><tr><th>N°</th><th>Fecha</th><th>Cliente</th><th class="r">Total</th><th class="r">Abono inicial</th><th class="r">Crédito</th><th class="r">Pagado después</th><th class="r">Saldo</th><th>Vence</th></tr></thead><tbody>${cr.map(s=>`<tr class="click" data-act="openSale" data-id="${s.id}"><td>${esc(s.num)}</td><td>${fmtDT(s.ts)}</td><td>${esc(s.custName)}</td><td class="r money">${money(s.total)}</td><td class="r money">${money(r2(s.total-crCred(s)))}</td><td class="r money">${money(crCred(s))}</td><td class="r money">${money(crPaid(s))}</td><td class="r money">${money(Math.max(0,s.balance))}</td><td>${esc(s.due||'—')}</td></tr>`).join('')}</tbody></table>`:empty('No se otorgaron créditos en este período.')}</div>`}

const CAPS_SKIP=/^(rf|rt|pin_i|pn_i|pn_j|lg_p|lg_p2|lg_a|nu_p|sy_.*|ab_f|ex_d)$/,CAPS_CFG=/^(name|addr|legal)$/;
function capsOK(el){const ty=(el.getAttribute('type')||'text').toLowerCase();if(!(el.tagName==='TEXTAREA'||(el.tagName==='INPUT'&&ty==='text')))return false;
  if(el.getAttribute('inputmode')||el.dataset.nocaps!==undefined||el.dataset.tk||el.dataset.cust||el.dataset.cfglist||CAPS_SKIP.test(el.id||''))return false;
  return !el.dataset.cfg||CAPS_CFG.test(el.dataset.cfg)}
function fixField(el){
  if(!el||el.tagName==='SELECT')return;
  const ty=(el.getAttribute('type')||'text').toLowerCase(),im=(el.getAttribute('inputmode')||'').toLowerCase();
  if(el.tagName==='INPUT'&&ty==='text'&&(im==='decimal'||im==='numeric')){
    const v=el.value;let o=v.replace(/[^0-9.,]/g,'');const k=o.search(/[.,]/);if(k>=0)o=o.slice(0,k+1)+o.slice(k+1).replace(/[.,]/g,'');

function applyPromos(lines){const P=(S.promos||[]).filter(promoOn);if(!P.length)return lines;const out=lines.map(l=>({...l})),d=out.map(()=>0),nm=out.map(()=>''),qb={};out.forEach(l=>qb[l.pid]=(qb[l.pid]||0)+l.qty);

function viewAnim(){const v=document.getElementById('view');if(!v)return;v.classList.remove('vin');void v.offsetWidth;v.classList.add('vin');clearTimeout(viewAnim.t);viewAnim.t=setTimeout(()=>v.classList.remove('vin'),450)}
/* ===== INICIO DE SESIÓN (PIN obligatorio, se pide al abrir el programa) ===== */
const LGN={sel:'',cancel:false,fails:0,until:0,sig:'',mode:''};
const pinOk4=v=>/^\d{4,6}$/.test(v);
function anyAdminPin(){const P=S.cfg.pins||{};return !!P['*']||S.sellers.some(n=>roleOf(n)==='dueno'&&P[n])}
function adminAuth(v){const P=S.cfg.pins||{},h=phash(v);return (P['*']&&P['*']===h)||S.sellers.some(n=>roleOf(n)==='dueno'&&P[n]&&P[n]===h)}
function createUser(n,pin,role){n=n.trim();S.sellers.push(n);(S.cfg.sellMeta=S.cfg.sellMeta||{})[n]={t:Date.now(),d:0};
  (S.cfg.pins=S.cfg.pins||{})[n]=phash(pin);(S.cfg.pinT=S.cfg.pinT||{})[n]=Date.now();
  setProf(p=>{p.roles=Object.assign({},p.roles);p.roles[n]=role})}
function lgEl(){let e=document.getElementById('lgin');if(!e){e=document.createElement('div');e.id='lgin';e.setAttribute('role','dialog');e.setAttribute('aria-modal','true');
  e.style.cssText='position:fixed;inset:0;z-index:95;background:var(--bg);color:var(--fg);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 14px 24px;overflow-y:auto';
  document.body.appendChild(e);e.addEventListener('keydown',ev=>{if(ev.key==='Enter'){const b=e.querySelector('[data-enter]');if(b){ev.preventDefault();b.click()}}})}return e}
function loginShow(cancel){LGN.sel='';LGN.cancel=!!cancel;closeModal();loginDraw()}
function loginDraw(){const e=lgEl(),U=S.sellers.slice(),P=S.cfg.pins||{};
  LGN.sig=JSON.stringify([U,Object.keys(P).filter(k=>P[k])]);
  const fld=(id,l,ph)=>`<label class="f">${l}<input id="${id}" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="${ph||''}"></label>`;

    else if(c==='"')q=true;
    else if(c===d){r.push(f);f=''}

/* ---- ripple en botones ---- */
document.addEventListener('pointerdown',e=>{if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;const el=e.target.closest&&e.target.closest('.btn,.tile,.tcard');if(!el||el.disabled)return;
  const r=el.getBoundingClientRect(),d=Math.max(r.width,r.height)*1.6,s=document.createElement('span');s.className='rip';s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;el.appendChild(s);setTimeout(()=>s.remove(),650)},true);
/* ---- números que suben al entrar a una pantalla ---- */
function countUps(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  $$('#view .tile-s b').forEach(b=>{const m=/^(-?)(\$?)(\d+(?:\.\d+)?)$/.exec(b.textContent.trim());if(!m)return;const neg=m[1],pre=m[2],to=parseFloat(m[3]),dec=(m[3].split('.')[1]||'').length;if(!to||to>1e9)return;const t0=performance.now(),D=650,fin=b.textContent;
    const step=t=>{const k=Math.min(1,(t-t0)/D),v=to*(1-Math.pow(1-k,3));b.textContent=k>=1?fin:neg+pre+v.toFixed(dec);if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)})}
{const _vaX=viewAnim;viewAnim=function(){_vaX.apply(this,arguments);try{countUps()}catch(e){}}}

setBizLogo();
loginShow(false);
</script>

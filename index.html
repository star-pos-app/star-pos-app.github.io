<style>
/* Layout: barra superior fija con navegación; Venta = catálogo + carrito lado a lado, el resto son tablas y formularios */
:root{
  --bg:#F5F4FA; --surface:#FFFFFF; --surface2:#ECEAF4; --line:#DAD7E6;
  --fg:#1C1933; --muted:#66637F; --accent:#5557AE; --accent-fg:#FFFFFF; --accent-soft:#E6E6F7;
  --ok:#14774C; --ok-bg:#DDF2E8; --warn:#9A5806; --warn-bg:#FBEBCF; --bad:#BD2430; --bad-bg:#FBE0E2;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-head:'Space Grotesk','Inter',system-ui,sans-serif;
  --r1:8px; --r2:12px; --shadow:0 1px 2px rgba(30,25,80,.05),0 6px 18px -10px rgba(30,25,80,.18);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12111C; --surface:#1B1A29; --surface2:#262439; --line:#35334C; --fg:#EEECFB; --muted:#A3A0C0;
  --accent:#A9ABF2; --accent-fg:#1A1B44; --accent-soft:#2A2B58;
  --ok:#52C78F; --ok-bg:#16352A; --warn:#EBA63F; --warn-bg:#3A2B12; --bad:#FF8087; --bad-bg:#401D22; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12111C; --surface:#1B1A29; --surface2:#262439; --line:#35334C; --fg:#EEECFB; --muted:#A3A0C0;
  --accent:#A9ABF2; --accent-fg:#1A1B44; --accent-soft:#2A2B58;
  --ok:#52C78F; --ok-bg:#16352A; --warn:#EBA63F; --warn-bg:#3A2B12; --bad:#FF8087; --bad-bg:#401D22; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 24px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
h1,h2,h3{font-family:var(--font-head);margin:0;text-wrap:balance}
h2{font-size:20px} h3{font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,td.r,th.r,.money{font-variant-numeric:tabular-nums}
.wrap{max-width:1440px;margin:0 auto}
/* top */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--line);
  margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 16px;padding:8px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.top .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;max-width:1440px;margin:0 auto}
.brand{font-family:var(--font-head);font-weight:700;font-size:18px;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;background:var(--accent);display:inline-block;transform:rotate(45deg)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--muted);border:0}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)}
nav{display:flex;gap:2px;overflow-x:auto;margin-top:6px;max-width:1440px;margin-inline:auto;scrollbar-width:thin}
nav a{padding:9px 14px;color:var(--muted);text-decoration:none;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
nav a svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav a.on svg{color:var(--accent)}
nav a.on{color:var(--fg);border-bottom-color:var(--accent)}
nav a:hover{color:var(--fg)}
/* controls */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r1);padding:8px 14px;font-weight:600;min-height:38px;transition:background .15s,filter .15s,transform .05s}.btn:active{transform:translateY(1px)}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)} .btn.pri:hover{filter:brightness(1.07)}
.btn.bad{color:var(--bad);border-color:var(--bad)} .btn.sm{padding:4px 10px;min-height:30px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:38px;width:100%;min-width:0}
input[type=checkbox]{width:auto;min-height:0;accent-color:var(--accent)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
label.f input,label.f select{font-weight:400;color:var(--fg)}
label.ck{display:flex;align-items:center;gap:8px;font-size:14px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar .grow{flex:1 1 220px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:16px;box-shadow:var(--shadow)}
.muted{color:var(--muted)} .small{font-size:12px}
.pill{display:inline-block;border-radius:99px;padding:1px 8px;font-size:11px;font-weight:700;background:var(--surface2);color:var(--muted)}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.tblw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface2);position:sticky;top:0}
td.r,th.r{text-align:right} tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer} tbody tr.click:hover td{background:var(--surface2)}
td.wrapc{white-space:normal;min-width:180px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.tile-s{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px;box-shadow:var(--shadow)}
.tile-s b{display:block;font-family:var(--font-head);font-size:24px;margin-top:2px}
.tile-s span{font-size:12px;color:var(--muted);font-weight:600}
.bklg{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:none;width:var(--s,44px);height:var(--s,44px);border-radius:calc(var(--s,44px)*.24);font-weight:800;font-size:calc(var(--s,44px)*.38);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);vertical-align:middle;line-height:1}
.bklg img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:10%}
.bklg img.own{padding:0;object-fit:cover;background:transparent}
.bkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:12px;margin-bottom:16px}
.bkcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.bkcard.off{opacity:.6}
.bkh{display:flex;gap:12px;align-items:flex-start}.bkt{flex:1;min-width:0}.bkt b{overflow-wrap:anywhere}
.bkb{text-align:right}.bkb b{display:block;font-family:var(--font-head);font-size:24px}
.bkact{display:flex;gap:6px;flex-wrap:wrap}
.bkmini{display:inline-flex;align-items:center;gap:5px;margin-right:12px;font-size:12px}
.bkpick{display:flex;gap:8px;flex-wrap:wrap}.bkpick .btn{display:flex;align-items:center;gap:8px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.banner{border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.banner.warn{background:var(--warn-bg);color:var(--warn)} .banner.bad{background:var(--bad-bg);color:var(--bad)}
/* venta */
.pos{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,430px);gap:16px;align-items:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px}
.tile{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:4px;min-height:92px;justify-content:space-between}
.tile:hover{border-color:var(--accent)} .tile .tn{font-weight:600;font-size:13px;overflow-wrap:anywhere}
.tile .tp{font-family:var(--font-head);font-weight:700;font-size:17px;color:var(--accent)} .tile .tc{font-size:11px;color:var(--muted)}
.tile.off{opacity:.55}
.cart{position:sticky;top:calc(env(safe-area-inset-top,0px) + 96px);background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;max-height:calc(100vh - 120px)}
.cart>div{padding:12px 14px} .cart .lines{overflow-y:auto;flex:1;min-height:120px;padding:0 14px;border-block:1px solid var(--line)}
.line{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.line:last-child{border-bottom:0}
.line .ln{font-weight:600;font-size:13px;overflow-wrap:anywhere}
.line .lt{font-family:var(--font-head);font-weight:700;text-align:right}
.line .ctl{grid-column:1/-1;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.line .ctl input{width:64px;min-height:30px;padding:3px 6px;text-align:right}
.line .ctl .q{width:48px;text-align:center}
.step{width:30px;min-height:30px;border:1px solid var(--line);background:var(--surface2);border-radius:6px;font-weight:700;padding:0}
.tot{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:13px}
.tot .big{font-family:var(--font-head);font-size:28px;font-weight:700;grid-column:1/-1;display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts .pri{grid-column:1/-1;font-size:17px;min-height:48px}
@media(max-width:860px){.pos{grid-template-columns:1fr}.cart{position:static;max-height:none}}
/* modal */
#modal{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 12px 16px;overflow-y:auto}
#modal[hidden]{display:none}
.scrim{position:fixed;inset:0;background:rgba(10,8,25,.55)}
.dlg{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--r2) + 2px);width:100%;max-width:520px;padding:18px;margin:auto;display:flex;flex-direction:column;gap:14px}
.dlg.wide{max-width:820px}
.dlg .hd{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlg .ft{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:200;display:flex;flex-direction:column;gap:6px;align-items:center;width:min(92vw,420px)}
.toast{background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.25);text-align:center}
.toast.bad{background:var(--bad);color:#fff}
.payrow{display:grid;grid-template-columns:130px 1fr auto;gap:8px;align-items:center}
.frsel{display:flex;flex-wrap:wrap;gap:8px}.frsel button{display:flex;flex-direction:column;align-items:center;gap:4px;width:78px;padding:8px 4px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);cursor:pointer;font:inherit;font-size:12px}.frsel button.on{border-color:var(--accent);background:var(--accent-soft);font-weight:700}.frsel canvas{width:40px;height:40px}
#custSug{position:fixed;z-index:90;max-height:288px;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 28px -8px rgba(0,0,0,.35);padding:4px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
#custSug::-webkit-scrollbar{width:6px}#custSug::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}#custSug::-webkit-scrollbar-button{display:none}
#custSug .csi{display:flex;flex-direction:column;gap:1px;justify-content:center;min-height:44px;padding:7px 10px;border-radius:8px;cursor:pointer}
#custSug .csi b{font-size:14px;overflow-wrap:anywhere}#custSug .csi span{font-size:12px;color:var(--muted)}
#custSug .csi:hover,#custSug .csi.on{background:var(--accent-soft)}
.pacct{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--surface2);border:1px solid var(--line)}.pacct .pat{flex:1;min-width:0}.pacct .pan{font-size:24px;font-weight:800;letter-spacing:.06em;overflow-wrap:anywhere;line-height:1.2;margin:2px 0}
.payinfo{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:700;padding:10px 12px;border-radius:10px;background:var(--surface2)}
.due{font-family:var(--font-head);font-size:34px;font-weight:700}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tcard{border:2px solid var(--line);background:var(--surface);border-radius:var(--r2);padding:10px;text-align:left;display:grid;gap:6px;min-height:0}
.tcard.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tcard .sw{display:flex;height:34px;border-radius:8px;overflow:hidden;border:1px solid rgba(128,128,128,.3)}.tcard .sw i{flex:1}
.tcard b{font-size:13px}.tcard span{font-size:12px;color:var(--muted)}
.tkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px 16px}
.tkprev{background:#fff;color:#000;border:1px dashed #999;border-radius:6px;padding:12px;font-family:'Courier New',monospace;font-size:12px;max-width:300px;width:100%}
.tkprev h4{margin:0;text-align:center;font-size:14px}.tkprev .c{text-align:center}.tkprev hr{border:0;border-top:1px dashed #000}.tkprev table{width:100%;border-collapse:collapse}.tkprev td,.tkprev th{padding:1px 0;border:0;background:none;color:#000;font-size:12px;text-transform:none;letter-spacing:0;white-space:normal;position:static}.tkprev .r{text-align:right}
.cust{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cust label{display:flex;align-items:center;gap:10px;font-weight:600}.cust input[type=color]{width:42px;height:34px;padding:2px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.paymodes{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:6px}
.paymodes .btn.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.payrow.single{grid-template-columns:1fr}.payrow.single label{display:none}
.quick{display:flex;gap:6px;flex-wrap:wrap}
/* ticket */
.ticket{background:#fff;color:#111;font-family:'Courier New',ui-monospace,monospace;font-size:12.5px;padding:14px;border-radius:8px;border:1px dashed #999;max-width:340px;margin:0 auto;width:100%}
.ticket h4{margin:0;text-align:center;font-size:15px} .ticket .c{text-align:center} .ticket hr{border:0;border-top:1px dashed #555;margin:6px 0}
.ticket table{width:100%;border-collapse:collapse} .ticket td,.ticket th{padding:1px 0;border:0;background:none;color:#111;font-size:12.5px;text-transform:none;letter-spacing:0;white-space:normal;position:static}
.ticket .r{text-align:right}
/* chart */
.chart{display:flex;align-items:flex-end;gap:4px;height:150px;padding-top:8px;border-bottom:1px solid var(--line)}
.chart .b{flex:1;min-width:6px;background:var(--accent);border-radius:3px 3px 0 0;position:relative}
.chart .b:hover{filter:brightness(1.15)}
.xl{display:flex;gap:4px;font-size:10px;color:var(--muted)} .xl span{flex:1;text-align:center;min-width:6px;overflow:hidden}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-top:16px}

.sbar{display:flex;gap:10px;margin-bottom:8px}
input.big{font-size:18px;min-height:54px;padding:10px 16px;border-width:2px}
input.big:focus{border-color:var(--accent);outline:none}
.sale{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,390px);gap:16px;align-items:start}
.side{display:grid;gap:12px;min-width:0}
.cartw{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:280px}
.crow{display:grid;grid-template-columns:minmax(0,1fr) 128px 120px 70px 88px 74px;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.crow.ch{background:var(--surface2);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding-block:8px}
.crow input{min-height:34px;padding:4px 8px;text-align:right}
.crow .cq{display:flex;gap:4px;align-items:center}.crow .cq input{text-align:center;width:50px;padding:4px}
.crow .ct{text-align:right;font-family:var(--font-head);font-weight:700;font-size:17px}
.crow .cn b{font-weight:600;overflow-wrap:anywhere;display:block}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cgrid .s2{grid-column:1/-1}
.cl-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end}
.cl-row .cl-st,.cl-row .cl-name,.cl-row .cl-addr,.cl-row .cl-act{grid-column:1/-1}
.cl-act{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cl-merch{margin-right:auto}
#custPanel input[readonly]{opacity:.8;cursor:default}
#custPanel input.bad{border-color:var(--bad)}
.change{padding:12px 16px;border-radius:12px;font-weight:700;font-size:17px;display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--surface2)}
.change b{font-family:var(--font-head);font-size:34px}
.change.ok{background:var(--ok-bg);color:var(--ok)}.change.bad{background:var(--bad-bg);color:var(--bad)}
input.bigin{font-size:26px;min-height:58px;font-weight:700;text-align:right}
details summary{cursor:pointer;font-weight:600;padding:6px 0}
.pkrow{display:flex;width:100%;justify-content:space-between;gap:12px;text-align:left;margin-bottom:6px;align-items:center}
.plist{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.prow{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,2.5fr) 76px 72px 64px;gap:14px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow.ph{background:var(--surface2);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding-block:8px}
.prow:not(.ph){cursor:pointer}.prow:not(.ph):hover{background:var(--surface2)}
.prow .pn b{display:block;font-weight:600;overflow-wrap:anywhere}
.pp{display:flex;gap:6px;flex-wrap:wrap}
.pr{display:inline-flex;flex-direction:column;min-width:66px;border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-weight:700;font-variant-numeric:tabular-nums;font-size:13px;line-height:1.25}
.pr i{font-style:normal;font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.prow .r{text-align:right}
@media(max-width:860px){
 .sale{grid-template-columns:1fr}
 .crow{grid-template-columns:1fr 1fr 1fr}.crow.ch{display:none}.crow .cn{grid-column:1/-1}.crow .ct{text-align:left}.crow .cx{text-align:right}

/* ===== abrir caja ===== */
.oc{max-width:480px;margin:18px auto;overflow:hidden;padding:0!important}

function custSuggest(el){

function code128(txt){txt=String(txt);const dig=/^\d+$/.test(txt)&&txt.length%2===0;let v;

const H={f:today(),t:today(),q:'',auto:true};
function histBody(){
  H.f=$('#hf').value||H.f;H.t=$('#ht').value||H.t;H.q=$('#hq').value;const q=norm(H.q);
  if(H.mode==='c')return histCred();
  const L=S.sales.filter(s=>s.ts>=dayStart(H.f)&&s.ts<=dayEnd(H.t)&&(!q||norm(s.num+' '+s.custName+' '+s.custIdent).includes(q))).sort((a,b)=>b.ts-a.ts);

  <div class="tblw">${L.length?`<table><thead><tr><th>N°</th><th>Fecha</th><th>Cliente</th><th>Pago</th><th class="r">Total</th><th>Estado</th></tr></thead><tbody>${L.map(s=>`<tr class="click" data-act="openSale" data-id="${s.id}"><td>${esc(s.num)}</td><td>${fmtDT(s.ts)}</td><td>${esc(s.custName)}</td><td>${s.pays.map(p=>PAY[p.m].n).join(' + ')}</td><td class="r money">${money(s.total)}</td><td>${s.status==='void'?(s.fixedBy?'<span class="pill warn">Corregida</span>':'<span class="pill bad">Anulada</span>'):s.balance>0?`<span class="pill warn">Debe ${money(s.balance)}</span>`:'<span class="pill ok">Pagada</span>'}</td></tr>`).join('')}</tbody></table>`:empty('No hay ventas en este período. Cuando cobre la primera aparecerá aquí.')}</div>`)}

function voidSale(id){const s=S.sales.find(x=>x.id===id);if(!s||s.status!=='ok')return;

function topData(){const d=today(),from=TOPP==='mes'?dayStart(d.slice(0,8)+'01'):TOPP==='anio'?dayStart(d.slice(0,5)+'01-01'):0,M={};

function lgTs(dk){return !dk||dk>=today()?Date.now():dayStart(dk)+12*36e5}
function lgAdd(acc,amt,type,concept,o){o=o||{};amt=r2(amt);if(!amt)return null;const ts=o.ts||Date.now();
  const e={id:uid(),ts,d:dkey(ts),acc,amt,type,concept:String(concept||'').slice(0,160),ref:o.ref||'',sid:o.sid===undefined?(S.caja?S.caja.id:null):o.sid,by:o.by||S.cfg.cur||''};e.u=o.u!==undefined?o.u:e.by;e.dev=DEV;if(o.pc)e.pc=o.pc;if(o.nl)e.nl=1;

function crTabs(){return `<div class="seg" role="tablist" style="margin-bottom:12px">${[['deuda','📒 Por cobrar'],['cobrados','✅ Cobrados']].map(([k,n])=>`<button role="tab" data-act="crTab" data-k="${k}" class="${CR.tab===k?'on':''}">${n}</button>`).join('')}</div>`}

function crSales(cid,all){return S.sales.filter(s=>s.customerId===cid&&s.status==='ok'&&s.credit&&(all||s.balance>0)).sort((a,b)=>a.ts-b.ts)}
function crPaid(s){return r2((s.abonos||[]).reduce((a,x)=>a+x.amt,0))}
function crOrig(s){return r2(s.balance+crPaid(s))}
function crOverDays(s){return Math.max(1,Math.round((dayStart(today())-dayStart(s.due))/864e5))}
function crOver(s){return s.status==='ok'&&s.balance>0&&!!s.due&&s.due<today()}
function crClients(){
  const ids=[...new Set(S.sales.filter(s=>s.status==='ok'&&s.credit).map(s=>s.customerId))];
  return ids.map(id=>{const L=crSales(id,true),open=L.filter(s=>s.balance>0);return {c:cust(id),L,open,debt:r2(open.reduce((a,s)=>a+s.balance,0)),orig:r2(open.reduce((a,s)=>a+crOrig(s),0)),over:open.filter(crOver)}}).filter(x=>x.c)}

  if(CR.tab==='cobrados')return vCobrados();

  <div class="kpis"><div class="panel"><div class="muted small">Nos deben en total</div><div class="due">${money(tot)}</div><div class="muted small">${nd} cliente(s) con deuda</div></div><div class="panel"><div class="muted small">Ya vencido</div><div class="due" style="color:var(--bad)">${money(ven)}</div><div class="muted small">${nv} cliente(s)</div></div></div>
  <div class="bar"><input id="crq" class="grow" placeholder="Buscar cliente o código" value="${esc(CR.q)}" data-inp="crList"><select id="crf" data-inp="crList">${[['open','Con deuda'],['paid','Pagados'],['all','Todos']].map(([k,n])=>`<option value="${k}" ${CR.f===k?'selected':''}>${n}</option>`).join('')}</select><label class="f" style="margin:0">Plazo por defecto (días)<input id="crd" inputmode="numeric" value="${S.cfg.crDays||0}" data-inp="crDays" style="width:90px"></label><button class="btn sm" data-act="crCleanAll">Quitar fotos de pagados</button></div><div id="crbody"></div>`;crList()}

function crList(){
  CR.q=($('#crq')||{}).value||'';CR.f=($('#crf')||{}).value||'open';const q=norm(CR.q).trim(),box=$('#crbody');if(!box)return;

function crCard(x){

function ntChime(){try{navigator.vibrate&&navigator.vibrate([120,60,120])}catch(e){}const c=ntAudio();if(!c)return;if(c.state!=='running'){NT_PEND=1;return}
  const t0=c.currentTime+.03;[[659.25,0],[880,.17],[1318.5,.34]].forEach(([f,d])=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t0+d);g.gain.linearRampToValueAtTime(.3,t0+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+d+.55);o.connect(g);g.connect(c.destination);o.start(t0+d);o.stop(t0+d+.6)})}
/* los navegadores solo dejan sonar tras un toque/tecla: se "desbloquea" con el primero y suena el aviso pendiente */

const crCred=s=>r2(s.total-s.pays.reduce((a,p)=>a+p.amt,0)+(s.change||0));
function crAbonos(f,t){const a=dayStart(f),b=dayEnd(t),o=[];
  for(const s of S.sales){if(s.status!=='ok'||!s.credit)continue;let run=crCred(s);
    (s.abonos||[]).forEach((x,i)=>{run=r2(run-x.amt);if(x.ts>=a&&x.ts<=b)o.push({ts:x.ts,s,x,cid:s.customerId,saldoVenta:run})})}
  return o.sort((p,q)=>q.ts-p.ts)}

  const by={};for(const o of L){(by[o.cid]=by[o.cid]||{n:0,amt:0}).amt=r2(by[o.cid].amt+o.x.amt);by[o.cid].n++}
  $('#cbbody').innerHTML=`<div class="tiles"><div class="tile-s"><span>Recuperado de créditos</span><b class="money">${money(tot)}</b></div><div class="tile-s"><span>Clientes que pagaron</span><b>${Object.keys(by).length}</b></div><div class="tile-s"><span>En efectivo → Caja</span><b class="money">${money(ef)}</b></div><div class="tile-s"><span>Por banco → Banco</span><b class="money">${money(bk)}</b></div><div class="tile-s"><span>Aún les deben</span><b class="money">${money(r2(Object.keys(by).reduce((a,id)=>a+debt(id),0)))}</b></div></div>
  <p class="muted small" style="margin:0 0 10px">Estos pagos no son ventas nuevas ni suman a las ventas del día; solo reducen la deuda y entran a Caja o Banco.</p>

  <h4 class="tsec">Detalle de pagos</h4><div class="tblw"><table><thead><tr><th>Fecha</th><th>Cliente</th><th>Deuda que pagó</th><th>Forma</th><th class="r">Monto</th><th class="r">Saldo de esa deuda</th><th>Recibió</th></tr></thead><tbody>${L.map(o=>`<tr><td>${fmtDT(o.ts)}</td><td>${crCode(cust(o.cid))}${esc(o.s.custName)}</td><td>${esc(o.s.num)} · ${fmtDT(o.s.ts).slice(0,10)}</td><td>${esc(PAY[o.x.m]?PAY[o.x.m].n:o.x.m)} <span class="muted small">→ ${o.x.m==='efectivo'?'Caja':'Banco'}</span></td><td class="r money">${money(o.x.amt)}</td><td class="r money">${money(o.saldoVenta)}</td><td>${esc(o.x.by||'')}</td></tr>`).join('')}</tbody></table></div>`:empty('No hubo cobros de créditos en este período.')}`}
function histCred(){
  const q=norm(H.q),a=dayStart(H.f),b=dayEnd(H.t),OK=S.sales.filter(s=>s.status==='ok');
  const inR=OK.filter(s=>s.ts>=a&&s.ts<=b),cont=inR.filter(s=>!s.credit),cr=inR.filter(s=>s.credit&&(!q||norm(s.num+' '+s.custName+' '+s.custIdent).includes(q))).sort((x,y)=>y.ts-x.ts);
  const otorg=r2(cr.reduce((x,s)=>x+crCred(s),0)),cobr=r2(crAbonos(H.f,H.t).reduce((x,o)=>x+o.x.amt,0)),pend=r2(OK.filter(s=>s.credit).reduce((x,s)=>x+Math.max(0,s.balance),0));
  $('#hbody').innerHTML=`<div class="tiles"><div class="tile-s"><span>Ventas cobradas (contado)</span><b class="money">${money(r2(cont.reduce((x,s)=>x+vnet(s),0)))}</b></div><div class="tile-s"><span>Créditos otorgados (${cr.length})</span><b class="money">${money(otorg)}</b></div><div class="tile-s"><span>Créditos cobrados en el período</span><b class="money">${money(cobr)}</b></div><div class="tile-s"><span>Pendiente de cobro (total)</span><b class="money">${money(pend)}</b></div></div>
  <p class="muted small" style="margin:0 0 10px">Lo vendido a crédito no es dinero en Caja ni en Banco hasta que el cliente paga. «Pendiente de cobro» es lo que los clientes deben hoy, de todos los créditos.</p>
  <div class="tblw">${cr.length?`<table><thead><tr><th>N°</th><th>Fecha</th><th>Cliente</th><th class="r">Total</th><th class="r">Abono inicial</th><th class="r">Crédito</th><th class="r">Pagado después</th><th class="r">Saldo</th><th>Vence</th></tr></thead><tbody>${cr.map(s=>`<tr class="click" data-act="openSale" data-id="${s.id}"><td>${esc(s.num)}</td><td>${fmtDT(s.ts)}</td><td>${esc(s.custName)}</td><td class="r money">${money(s.total)}</td><td class="r money">${money(r2(s.total-crCred(s)))}</td><td class="r money">${money(crCred(s))}</td><td class="r money">${money(crPaid(s))}</td><td class="r money">${money(Math.max(0,s.balance))}</td><td>${esc(s.due||'—')}</td></tr>`).join('')}</tbody></table>`:empty('No se otorgaron créditos en este período.')}</div>`}

/* Logo, datos del negocio, reglas de venta y todo lo del ticket. No incluye apariencia ni pantalla (son de cada equipo),
   ni establecimiento / punto de emisión / secuencial (distintos en cada equipo). */
const BIZ_KEYS=['city','coops','name','ruc','addr','tel','regimen','docType','legal','logo','ivaRate','incIva','cfLimit','footer','tk','tkLogo','tkFrame','requireCaja','allowNeg','waAuto','listNames','t2','t3','paper','pPaper','pPrintable','pFont','pBold','pLogo','pDpi','feed','feedMm'];
function bizSnap(){const o={};for(const k of BIZ_KEYS)if(S.cfg[k]!==undefined)o[k]=S.cfg[k];return o}
function bizApply(x){const d=x.data||{},sn=d.cfg;if(!sn)return 0;const t=d.t||x.u||0,sy=S.sync;
  if(t<=(S.cfg.bizT||0))return 0;
  if(isOwner()&&S.cfg.bizT&&hsh(bizSnap())!==sy.h['biz:cfg'])return 0;
  for(const k of BIZ_KEYS)if(k in sn)S.cfg[k]=sn[k];
  S.cfg.bizT=t;sy.h['biz:cfg']=hsh(bizSnap());
  try{setBizLogo();const b=$('#bname');if(b)b.textContent=S.cfg.name||'STAR'}catch(e){}return 1}
/* Empleados: pantalla en solo lectura + solicitar cambios al administrador */
const REQ_AREAS=['Datos del negocio / logo','Impresión del ticket','Reglas de venta o precios','Otro'];
function bizLock(){const v=$('#view');if(!v)return;
  if(isOwner()){const R=(S.requests||[]).filter(r=>!r.done).sort((a,b)=>b.ts-a.ts);if(!R.length)return;
    const h=document.createElement('div');h.className='panel';h.style.marginBottom='16px';
    h.innerHTML=`<h3 style="margin:0 0 4px">📨 Solicitudes de cambio (${R.length})</h3><p class="muted small" style="margin:0 0 8px">Sus empleados piden estos cambios. Hágalos en Ajustes y marque «Atendida».</p><div class="tblw"><table><tbody>${R.map(r=>`<tr><td style="white-space:nowrap">${fmtDT(r.ts)}</td><td>${esc(r.u||'')}</td><td><span class="pill">${esc(r.area||'')}</span> ${esc(r.text)}</td><td><button class="btn sm pri" data-act="reqDone" data-id="${r.id}">Atendida</button></td></tr>`).join('')}</tbody></table></div>`;
    const bar=v.querySelector('.bar');bar?bar.after(h):v.prepend(h);return}
  const mine=(S.requests||[]).filter(r=>r.u===cUser()).sort((a,b)=>b.ts-a.ts).slice(0,3);
  const ban=k=>`<div class="panel bizban" data-sec="${k}" style="margin-bottom:16px"><b>🔒 Esto lo configura el administrador del negocio.</b><div class="muted small" style="margin:4px 0 8px">Usted ya recibe el logo, los datos y el formato del ticket automáticamente. Si necesita un cambio, solicítelo.</div><button class="btn sm pri reqbtn" data-act="reqOpen">Solicitar cambio al administrador</button>${mine.length?`<div class="muted small" style="margin-top:8px">Sus solicitudes: ${mine.map(r=>(r.done?'✓ atendida':'⏳ pendiente')+' · '+esc(r.text.slice(0,40))).join(' | ')}</div>`:''}</div>`;
  const first=v.querySelector('[data-sec]');const html=['neg','vta','tick'].map(ban).join('');if(first)first.insertAdjacentHTML('beforebegin',html);
  v.querySelectorAll('[data-sec="neg"],[data-sec="vta"],[data-sec="tick"]').forEach(c=>{if(c.classList.contains('bizban'))return;c.querySelectorAll('input,select,textarea,button').forEach(e=>{e.disabled=true});c.style.opacity='.9'})}

  S.requests=S.requests||[];S.requests.push({id:uid(),ts:Date.now(),u:cUser(),area:$('#rq_a').value,text:t,done:0,_u:Date.now()});save(true);closeModal();toast('Solicitud enviada al administrador.');if($('#view'))vAjustes()};

const banks=()=>bkAll().filter(b=>!b.off);
const bkGet=id=>bkAll().find(b=>b.id===id);
const bkName=id=>{const b=bkGet(id);return b?b.name:''};
function bkDef(){const L=banks();if(!L.length)return '';const d=L.find(b=>b.id===S.cfg.bankDef);return (d||L[0]).id}
const bkOf=e=>{const b=e.bk&&bkGet(e.bk);return b?b.id:bkDef()};
function bkBal(id){return r2(S.ledger.reduce((a,e)=>e.acc==='banco'&&bkOf(e)===id?a+e.amt:a,0))}
const bkNum=b=>{const n=String(b.num||'');return !n?'Sin número':isOwner()?n:'•••• '+n.slice(-4)};
function bkTouch(){S.cfg.banksT=Date.now()}
function bkColor(name){let h=0;for(const c of String(name))h=(h*31+c.charCodeAt(0))%360;return `hsl(${h} 55% 38%)`}
function bkInit(name){const w=String(name||'').replace(/^(banco|cooperativa|coop\.?)\s+(de(l)?\s+)?/i,'').trim().split(/\s+/).filter(Boolean);return ((w[0]||'?')[0]+((w[1]||w[0]||'')[1]||'')).toUpperCase()}
function bkLogo(b,sz){sz=sz||46;
  const own=bkOwn(b,sz);if(own)return `<span class="bklg" style="--s:${sz}px;background:${esc(b.color||'#64748b')};color:${esc(b.fg||'#fff')}"><img class="own" src="${own}" alt=""></span>`;
  const u=b.d?'https://www.google.com/s2/favicons?domain='+encodeURIComponent(b.d)+'&sz=128':'';
  return `<span class="bklg" style="--s:${sz}px;background:${esc(b.color||'#64748b')};color:${esc(b.fg||'#fff')}">${esc(b.s||bkInit(b.name))}${u?`<img src="${u}" alt="" loading="lazy" referrerpolicy="no-referrer" data-d="${esc(b.d)}" onload="bkImgOk(this)" onerror="bkImgErr(this)">`:''}</span>`}
function bkImgErr(i){if(!i.dataset.t&&i.dataset.d){i.dataset.t=1;i.src='https://icons.duckduckgo.com/ip3/'+i.dataset.d+'.ico'}else i.remove()}
function bkImgOk(i){if(i.naturalWidth&&i.naturalWidth<24)bkImgErr(i)}
/* Lista desplegable de bancos (solo aparece si hay 2 o más) */
function bkSel(id,sel,label,extra){const L=banks();if(L.length<2)return '';const g=bkGet(sel),s=g&&!g.off?g.id:bkDef();
  return `<label class="f">${label}<select id="${id}" ${extra||''}>${L.map(b=>`<option value="${b.id}" ${b.id===s?'selected':''}>${esc(b.name)}${b.num?' · …'+esc(String(b.num).slice(-4)):''}</option>`).join('')}</select></label>`}
/* Resumen pequeño que se ve dentro de Caja */
function bkMini(){const L=banks();if(!L.length)return 'Cuenta bancaria del negocio';
  return L.map(b=>`<span class="bkmini">${bkLogo(b,18)}<span>${esc(b.name.replace(/^Banco (del? )?/i,''))}</span> <b class="money">${money(bkBal(b.id))}</b></span>`).join('')+(bancoOK()?' <a href="#banco" class="small">Ver detalle</a>':'')}
CH.payAcct=()=>payAcct();
CH.tbAv=el=>{const a=$('#t_av');if(a&&el.value)a.textContent=money(bkBal(el.value))};

function vBanco(){
  if(!bancoOK()){$('#view').innerHTML='<div class="panel"><b>Este usuario no tiene acceso al Banco.</b></div>';return}
  try{ensureDeuna()}catch(e){}
  const own=isOwner(),L=bkAll(),act=banks(),tot=lgBalAll('banco'),f=lgFrom(),per={};
  for(const b of L)per[b.id]={in:0,out:0};
  for(const e of S.ledger){if(e.acc!=='banco'||e.ts<f||e.type==='anulacion'||lgRevd(e))continue;const q=per[bkOf(e)];if(!q)continue;if(e.amt>0)q.in=r2(q.in+e.amt);else q.out=r2(q.out-e.amt)}
  const tin=r2(Object.values(per).reduce((a,x)=>a+x.in,0)),tout=r2(Object.values(per).reduce((a,x)=>a+x.out,0)),pend=r2(lgBalAll('porconfirmar')),per_=LG.r==='hoy'?'hoy':'período';
  const btn=(a,t,x,c)=>`<button class="btn sm ${c||''}" data-act="${a}" ${x}>${t}</button>`;
  const card=b=>{const q=per[b.id],bal=bkBal(b.id),d=bkDef()===b.id&&act.length>1;
    return `<div class="bkcard ${b.off?'off':''}"><div class="bkh">${bkLogo(b,52)}<div class="bkt"><b>${esc(b.name)}</b>${d?' <span class="pill ok">Principal</span>':''}${b.off?' <span class="pill">Oculto</span>':''}
      <div class="muted small">${esc(b.type||'Cuenta')} · <span style="font-size:19px;font-weight:800;color:var(--fg);letter-spacing:.04em">${esc(bkNum(b))}</span>${own&&b.num?` <button class="btn sm" data-act="bkCopy" data-id="${b.id}" title="Copiar número de cuenta" aria-label="Copiar número de cuenta">Copiar</button>`:''}</div>
      ${b.holder?`<div class="muted small">Titular: ${esc(b.holder)}</div>`:''}${b.note?`<div class="muted small">${esc(b.note)}</div>`:''}</div>
      <div class="bkb"><span class="muted small">Debería tener</span><b class="money" style="color:var(${bal<0?'--bad':'--fg'})">${money(bal)}</b></div></div>
      <div class="muted small">Entró ${money(q.in)} · Salió ${money(q.out)} (${per_})</div>
      <div class="bkact">${b.off?(own?btn('bkEdit','Editar','data-id="'+b.id+'"'):''):btn('lgMove','Depósito','data-acc="banco" data-t="ingreso" data-bk="'+b.id+'"')+btn('lgExp','Gasto','data-p="banco" data-bk="'+b.id+'"')+btn('lgTr','Pasar a Caja','data-from="banco" data-to="caja" data-bk="'+b.id+'"')+(act.length>1?btn('bkMove','Mover a otro banco','data-id="'+b.id+'"'):'')+btn('bkVerify','Verificar saldo','data-id="'+b.id+'"')+btn('bkHist','Movimientos','data-id="'+b.id+'"')+(own?btn('bkEdit','Editar','data-id="'+b.id+'"'):'')}</div></div>`};
  const H=S.ledger.map((e,i)=>({e,i})).filter(x=>x.e.acc==='banco'&&x.e.ts>=f).sort((a,b)=>b.e.ts-a.e.ts||b.i-a.i).slice(0,60).map(x=>x.e);
  const empt=!L.length;
  $('#view').innerHTML=`<div class="bar"><h2 style="margin-right:auto">Banco</h2><div class="seg">${[['hoy','Hoy'],['7','7 días'],['mes','Este mes'],['todo','Todo']].map(([k,n])=>`<button data-act="lgRange" data-k="${k}" class="${LG.r===k?'on':''}">${n}</button>`).join('')}</div>${own?'<button class="btn pri" data-act="bkAdd">＋ Agregar banco</button>':''}</div>
  <div class="tiles"><div class="tile-s"><span>🏦 Total que debería haber en bancos</span><b class="money" style="color:var(${tot<0?'--bad':'--fg'})">${money(tot)}</b></div><div class="tile-s"><span>Entró (${per_})</span><b class="money">${money(tin)}</b></div><div class="tile-s"><span>Salió (${per_})</span><b class="money">${money(tout)}</b></div>${own&&pend?`<div class="tile-s"><span>⏳ Por confirmar</span><b class="money">${money(pend)}</b></div>`:''}</div>
  ${own?pcOwner():''}
  ${empt?`<div class="panel"><h3 style="margin:0 0 4px">Agregue sus cuentas bancarias</h3><p class="muted small" style="margin:0 0 12px">Elija su banco: el logo se busca solo. Después podrá ver cuánto dinero debería tener en cada cuenta.${tot?` Ya hay <b>${money(tot)}</b> registrados en Banco; se asignarán a la primera cuenta que cree.`:''}</p>${own?`<div class="bkpick">${BANKS_EC.slice(0,6).map(b=>`<button class="btn" data-act="bkAdd" data-k="${b.k}">${bkLogo({d:b.d,color:b.c,fg:b.f,s:b.s},28)}${esc(b.n)}</button>`).join('')}<button class="btn" data-act="bkAdd" data-k="otro">Otro banco…</button></div>`:'<div class="muted small">Pida al administrador que agregue los bancos.</div>'}</div>`:`<div class="bkgrid">${L.slice().sort((a,b)=>(a.off?1:0)-(b.off?1:0)).map(card).join('')}</div>`}
  <h4 class="tsec">Movimientos de banco (${LG.r==='hoy'?'hoy':LG.r==='7'?'últimos 7 días':LG.r==='mes'?'este mes':'todo'})</h4>${H.length?`<div class="tblw" style="max-height:360px;overflow:auto"><table><thead><tr><th>Fecha</th><th>Banco</th><th>Detalle</th><th class="r">Monto</th><th></th></tr></thead><tbody>${H.map(e=>{const b=bkGet(bkOf(e));return `<tr><td style="white-space:nowrap">${fmtDT(e.ts)}</td><td>${b?`<span class="bkmini" style="margin:0">${bkLogo(b,18)}${esc(b.name)}</span>`:'—'}</td><td><span class="pill ${e.type==='anulacion'?'bad':e.type==='transfer'?'warn':'ok'}">${LGT[e.type]||e.type}</span> ${esc(e.concept)}${e.by?` <span class="muted small">· ${esc(e.by)}</span>`:''}</td><td class="r money">${lgSg(e.amt)}</td><td>${['ingreso','retiro','transfer'].includes(e.type)&&!lgRevd(e)?`<button class="btn sm" data-act="lgUndo" data-id="${e.id}" title="Anular este movimiento" aria-label="Anular">↩</button>`:''}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="muted small">Sin movimientos en este período.</div>'}
  <p class="muted small" style="margin:10px 0 0">«Debería tener» es lo que el sistema calcula: ventas y cobros por transferencia, depósitos, gastos y traslados. Compárelo con su app del banco con «Verificar saldo». El total también se ve en Caja. Los créditos pendientes no cuentan hasta que el cliente paga.</p>`}

/* --- agregar / editar --- */
function bkDraft(){const k=$('#bk_k').value,pre=BANKS_EC.find(x=>x.k===k),name=$('#bk_n').value.trim(),d=$('#bk_w').value.trim().replace(/^https?:\/\//i,'').replace(/^www\./i,'').replace(/\/.*$/,'');
  return pre?{k,name:name||pre.n,d:d||pre.d,color:pre.c,fg:pre.f,s:pre.s}:{k:'otro',name,d,color:bkColor(name||'x'),fg:'#FFFFFF',s:bkInit(name)}}
function bkPrev(){const b=bkDraft(),x=$('#bk_prev');if(x)x.innerHTML=`${bkLogo(b,52)}<div><b>${esc(b.name||'Nombre del banco')}</b><div class="muted small">${b.d?'Logo: '+esc(b.d):'Escriba la página web del banco para buscar su logo'}</div></div>`}
IN.bkPrev=bkPrev;
CH.bkPre=el=>{const x=BANKS_EC.find(p=>p.k===el.value);$('#bk_n').value=x?x.n:'';$('#bk_w').value=x?x.d:'';bkPrev()};
function bkModal(id,pk){const b=id?bkGet(id):null,first=!bkAll().length,pre=BANKS_EC.find(x=>x.k===(b?b.k:pk)),adopt=!id&&first&&lgBalAll('banco')!==0,v=(b&&b.name)||(pre&&pre.n)||'';
  modal(`${dlgHead(b?'Editar banco':'Agregar banco')}<div id="bk_prev" style="display:flex;gap:12px;align-items:center;margin-bottom:10px"></div>
  <label class="f">Banco<select id="bk_k" data-chg="bkPre">${BANKS_EC.map(x=>`<option value="${x.k}" ${pre&&pre.k===x.k?'selected':''}>${esc(x.n)}</option>`).join('')}<option value="otro" ${!pre?'selected':''}>Otro banco o cooperativa…</option></select></label>
  <div class="fgrid"><label class="f">Nombre<input id="bk_n" value="${esc(v)}" placeholder="Ej: Cooperativa JEP" data-inp="bkPrev"></label>
  <label class="f">Página web (para buscar el logo)<input id="bk_w" data-nocaps value="${esc((b&&b.d)||(pre&&pre.d)||'')}" placeholder="Ej: jep.fin.ec" data-inp="bkPrev" autocapitalize="none"></label>
  <label class="f">Tipo de cuenta<select id="bk_t">${['Ahorros','Corriente','Otra'].map(t=>`<option ${b&&b.type===t?'selected':''}>${t}</option>`).join('')}</select></label>
  <label class="f">Número de cuenta<input id="bk_c" inputmode="numeric" autocomplete="off" value="${esc((b&&b.num)||'')}" placeholder="Solo números"></label>
  <label class="f">Titular (opcional)<input id="bk_h" value="${esc((b&&b.holder)||'')}"></label>
  <label class="f">Nota (opcional)<input id="bk_o" value="${esc((b&&b.note)||'')}" placeholder="Ej: cuenta del negocio"></label>
  ${!b&&!adopt?`<label class="f">Saldo actual en esta cuenta<input id="bk_s" inputmode="decimal" autocomplete="off" placeholder="0.00"></label>`:''}</div>
  ${adopt?`<p class="muted small" style="margin:4px 0">Ya hay <b>${money(lgBalAll('banco'))}</b> registrados en Banco: se asignan a esta cuenta.</p>`:''}
  ${(b&&banks().length>1)||(!b&&banks().length>=1)?`<label style="display:flex;gap:8px;align-items:center;margin:8px 0;font-size:13px"><input id="bk_p" type="checkbox" ${b&&bkDef()===b.id?'checked':''}> Banco principal (donde se acreditan por defecto los cobros por transferencia)</label>`:''}
  <div class="ft">${b?`<button class="btn bad" data-act="bkRemove" data-id="${b.id}" style="margin-right:auto">${b.off?'Mostrar de nuevo':'Eliminar u ocultar'}</button>`:''}<button class="btn" data-act="closeModal">Cancelar</button><button class="btn pri" data-act="bkSave" data-id="${id||''}">Guardar</button></div>`);bkPrev()}
A.bkAdd=el=>!isOwner()?toast('Solo el administrador puede agregar bancos.',1):bkModal('',el.dataset.k);
A.bkEdit=el=>!isOwner()?toast('Solo el administrador puede editar bancos.',1):bkModal(el.dataset.id);
A.bkSave=el=>guardOwner('Guardar banco',()=>{const id=el.dataset.id,d=bkDraft(),num=($('#bk_c').value||'').replace(/\s|-/g,'');
  if(!d.name)return toast('Escriba el nombre del banco.',1);
  if(num&&!/^\d{4,22}$/.test(num))return toast('El número de cuenta debe tener solo números.',1);
  if(bkAll().some(x=>x.id!==id&&num&&x.num===num&&x.name===d.name))return toast('Esa cuenta ya está registrada.',1);
  const o={k:d.k,name:d.name,d:d.d,color:d.color,fg:d.fg,s:d.s,type:$('#bk_t').value,num,holder:$('#bk_h').value.trim(),note:$('#bk_o').value.trim()};
  S.cfg.banks=S.cfg.banks||[];let b;
  if(id){b=bkGet(id);Object.assign(b,o)}
  else{b=Object.assign({id:uid(),off:0},o);const first=!banks().length;S.cfg.banks.push(b);if(first){S.cfg.bankDef=b.id;S.ledger.forEach(e=>{if(e.acc==='banco'&&!e.bk)e.bk=b.id})}
    const sal=r2(num0($('#bk_s')));if(sal)lgAdd('banco',sal,'saldo_ini','Saldo inicial · '+b.name,{bk:b.id})}
  if($('#bk_p')&&$('#bk_p').checked)S.cfg.bankDef=b.id;
  bkTouch();save(true);closeModal();toast(id?'Banco actualizado.':'Banco agregado.');render()});
function num0(el){return el?num(el.value):0}
A.bkRemove=el=>guardOwner('Quitar banco',()=>{const b=bkGet(el.dataset.id);if(!b)return;
  if(b.off){b.off=0;bkTouch();save(true);closeModal();render();return toast('Banco visible de nuevo.')}
  const used=S.ledger.some(e=>e.acc==='banco'&&bkOf(e)===b.id),bal=bkBal(b.id);
  if(used&&Math.abs(bal)>=0.005)return toast('Este banco tiene '+money(bal)+'. Pase ese dinero a otro banco o a Caja antes de ocultarlo.',1);
  confirmBox(used?'Se ocultará «'+b.name+'». Sus movimientos quedan guardados.':'Se eliminará «'+b.name+'».',()=>{
    if(used)b.off=1;else S.cfg.banks=S.cfg.banks.filter(x=>x.id!==b.id);
    if(S.cfg.bankDef===b.id)S.cfg.bankDef='';bkTouch();save(true);closeModal();render();toast(used?'Banco oculto.':'Banco eliminado.')},used?'Ocultar':'Eliminar',1)});
A.bkCopy=el=>{const b=bkGet(el.dataset.id);if(!b||!b.num)return;
  try{navigator.clipboard.writeText(b.num).then(()=>toast('Número de cuenta copiado.'),()=>toast('Cuenta: '+b.num))}catch(e){toast('Cuenta: '+b.num)}};

/* --- mover dinero entre bancos --- */
A.bkMove=el=>{const b=bkGet(el.dataset.id),O=banks().filter(x=>x.id!==b.id);if(!O.length)return toast('Agregue otro banco primero.',1);
  modal(`${dlgHead('Mover dinero entre bancos')}<div class="payinfo"><span>${esc(b.name)} · disponible</span><span class="money">${money(bkBal(b.id))}</span></div>
  <div class="fgrid"><label class="f">Pasar a<select id="bm_to">${O.map(x=>`<option value="${x.id}">${esc(x.name)}${x.num?' · …'+esc(String(x.num).slice(-4)):''}</option>`).join('')}</select></label><label class="f">Cantidad<input id="bm_a" inputmode="decimal" autocomplete="off" autofocus></label><label class="f">Fecha<input id="bm_d" type="date" value="${today()}" max="${today()}"></label></div>
  <label class="f">Motivo u observación<input id="bm_w" placeholder="Ej: transferencia entre mis cuentas"></label><p class="muted small" style="margin:0">Es un traslado: no es un gasto ni una venta, y el total en bancos no cambia.</p>
  <div class="ft"><button class="btn" data-act="closeModal">Cancelar</button><button class="btn pri" data-act="bkMoveDo" data-id="${b.id}">Mover</button></div>`)};
A.bkMoveDo=el=>{const from=el.dataset.id,to=$('#bm_to').value,a=r2(num($('#bm_a').value)),w=$('#bm_w').value.trim();
  if(a<=0)return toast('Ingrese la cantidad.',1);if(a>bkBal(from))return toast('No hay tanto en '+bkName(from)+' ('+money(bkBal(from))+').',1);
  const ts=lgTs($('#bm_d').value),grp=uid(),tx=w?': '+w:'';
  lgAdd('banco',-a,'transfer','A '+bkName(to)+tx,{ts,grp,cp:'banco',bk:from});lgAdd('banco',a,'transfer','Desde '+bkName(from)+tx,{ts,grp,cp:'banco',bk:to});
  save(true);closeModal();toast('Movido '+money(a)+' de '+bkName(from)+' a '+bkName(to)+'.');render()};

/* --- verificar saldo contra la app del banco --- */
A.bkVerify=el=>{const b=bkGet(el.dataset.id);
  modal(`${dlgHead('Verificar saldo · '+esc(b.name))}<div class="payinfo"><span>Debería tener según el sistema</span><span class="money">${money(bkBal(b.id))}</span></div>
  <label class="f">Saldo real que ve en su banco<input id="bv_a" inputmode="decimal" autocomplete="off" data-inp="bkDiff" data-id="${b.id}" autofocus></label><div id="bv_d" class="muted" style="margin:4px 0"></div>
  ${isOwner()?`<label style="display:flex;gap:8px;align-items:center;font-size:13px"><input id="bv_adj" type="checkbox"> Ajustar el saldo del sistema al saldo real</label>`:''}
  <div class="ft"><button class="btn" data-act="closeModal">Cerrar</button>${isOwner()?`<button class="btn pri" data-act="bkVerifyDo" data-id="${b.id}">Aplicar ajuste</button>`:''}</div>`)};
IN.bkDiff=el=>{const v=el.value,sys=bkBal(el.dataset.id);$('#bv_d').innerHTML=v===''?'':(d=>`Diferencia: <b style="color:var(${Math.abs(d)<0.005?'--ok':'--bad'})">${money(d)}</b> ${d<0?'(el banco tiene menos de lo que debería)':d>0?'(el banco tiene más de lo que debería)':'(cuadra ✓)'}`)(r2(num(v)-sys))};
A.bkVerifyDo=el=>guardOwner('Ajustar saldo de banco',()=>{const id=el.dataset.id,v=$('#bv_a').value;if(v==='')return toast('Ingrese el saldo real.',1);
  const d=r2(num(v)-bkBal(id));if(Math.abs(d)<0.005){closeModal();return toast('El saldo cuadra ✓')}
  if(!$('#bv_adj').checked)return toast('Marque «Ajustar el saldo del sistema» para aplicar la diferencia de '+money(d)+'.',1);
  lgAdd('banco',d,'ajuste','Ajuste al saldo real de '+bkName(id),{bk:id});save(true);closeModal();toast('Saldo ajustado.');render()});

/* --- movimientos de un banco --- */
A.bkHist=el=>{const id=el.dataset.id,b=bkGet(id),f=lgFrom();let run=0;
  const H=S.ledger.map((e,i)=>({e,i})).filter(x=>x.e.acc==='banco'&&bkOf(x.e)===id).sort((a,c)=>a.e.ts-c.e.ts||a.i-c.i).map(x=>{run=r2(run+x.e.amt);return {...x.e,run}}).filter(x=>x.ts>=f).reverse();
  modal(`${dlgHead('Movimientos · '+esc(b.name))}<div class="muted small">${LG.r==='hoy'?'Hoy':LG.r==='7'?'Últimos 7 días':LG.r==='mes'?'Este mes':'Todo'} · cambie el período en la pantalla Banco.</div>
  ${H.length?`<div class="tblw" style="max-height:420px;overflow:auto"><table><thead><tr><th>Fecha</th><th>Detalle</th><th class="r">Monto</th><th class="r">Saldo</th></tr></thead><tbody>${H.slice(0,120).map(e=>`<tr><td style="white-space:nowrap">${fmtDT(e.ts)}</td><td><span class="pill ${e.type==='anulacion'?'bad':e.type==='transfer'?'warn':'ok'}">${LGT[e.type]||e.type}</span> ${esc(e.concept)}</td><td class="r money">${lgSg(e.amt)}</td><td class="r money">${money(e.run)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="muted small">Sin movimientos en este período.</div>'}
  <div class="ft"><button class="btn pri" data-act="closeModal">Cerrar</button></div>`,1)};

/* ===== acciones de Caja y Banco (Etapa 5) ===== */
A.lgRange=el=>{LG.r=el.dataset.k;lgRefresh()};
A.lgMove=el=>lgMoveModal(el.dataset.acc,el.dataset.t,el.dataset.bk);
A.lgMoveDo=el=>{const acc=el.dataset.acc,t=el.dataset.t;if(acc==='ahorro'&&!isOwner())return toast('Solo el administrador maneja los ahorros.',1);const a=r2(num($('#m_amt').value)),w=$('#m_why').value.trim();
  if(a<=0)return toast('Ingrese un monto.',1);if(!w)return toast('Indique el concepto.',1);
  if(acc==='ahorro'&&t==='retiro'&&a>lgBalAll('ahorro'))return toast('No hay tanto en Ahorros ('+money(lgBalAll('ahorro'))+').',1);

function promoType(){const t=$('#pr_t').value,pi=(i,q)=>`<div class="fgrid"><label class="f">Producto ${q?i+1:''}<input id="pr_p${i}" list="pr_dl" autocomplete="off" placeholder="Escriba para buscar"></label>${q?`<label class="f">Cantidad<input id="pr_q${i}" type="number" min="1" value="1"></label>`:''}</div>`;
  $('#pr_f').innerHTML=t==='nxm'?pi(0)+`<div class="fgrid"><label class="f">Lleve<input id="pr_n" type="number" min="2" value="3"></label><label class="f">Pague<input id="pr_m" type="number" min="1" value="2"></label></div>`:t==='pct'?pi(0)+`<label class="f">Descuento %<input id="pr_c" type="number" min="1" max="90" value="10"></label>`:pi(0,1)+pi(1,1)+pi(2,1)+`<label class="f">Precio del combo ($)<input id="pr_c" type="number" step="any" min="0" inputmode="decimal"></label><div class="muted small">Se aplica solo cuando el cliente lleva todos los productos. Deje vacío el tercero si son dos.</div>`}
A.promoNew=()=>{modal(`${dlgHead('Nueva promoción')}<label class="f">Tipo<select id="pr_t" onchange="promoType()"><option value="nxm">Lleve N, pague M (ej. 3×2)</option><option value="combo">Combo con precio fijo</option><option value="pct">% de descuento</option></select></label><datalist id="pr_dl">${S.products.filter(p=>p.active&&p.id!=='p_libre').map(p=>`<option value="${esc(p.name)}">`).join('')}</datalist><div id="pr_f"></div><div class="fgrid"><label class="f">Desde (opcional)<input id="pr_a" type="date"></label><label class="f">Hasta (opcional)<input id="pr_b" type="date"></label></div><div class="ft"><button class="btn" data-act="closeModal">Cancelar</button><button class="btn pri" data-act="promoSave">Guardar</button></div>`);promoType()};
A.promoSave=()=>{const t=$('#pr_t').value,fp=i=>{const e=$('#pr_p'+i);return e&&S.products.find(p=>p.name===e.value.trim())},o={id:uid(),type:t,on:true,from:$('#pr_a').value,to:$('#pr_b').value};
  if(t==='combo'){o.items=[];for(let i=0;i<3;i++){const p=fp(i);if(p&&!o.items.some(x=>x.pid===p.id))o.items.push({pid:p.id,q:Math.max(1,num($('#pr_q'+i).value))})}o.price=r2(num($('#pr_c').value));if(o.items.length<2||o.price<=0)return toast('Elija al menos 2 productos y el precio del combo.',1);o.name='Combo '+o.items.map(i=>pnm(i.pid).slice(0,18)).join(' + ')}
  else{const p=fp(0);if(!p)return toast('Elija un producto de la lista.',1);o.pid=p.id;if(t==='nxm'){o.n=num($('#pr_n').value);o.m=num($('#pr_m').value);if(!(o.n>o.m&&o.m>=1))return toast('«Lleve» debe ser mayor que «pague».',1);o.name=`${o.n}×${o.m} ${p.name.slice(0,26)}`}else{o.pct=num($('#pr_c').value);if(!(o.pct>0&&o.pct<=90))return toast('Descuento entre 1 y 90.',1);o.name=`${o.pct}% ${p.name.slice(0,26)}`}}
  S.promos.push(o);save(true);closeModal();render();toast('Promoción creada.')};
A.promoTog=el=>{const p=S.promos.find(x=>x.id===el.dataset.id);if(p){p.on=p.on===false;save(true);render()}};
A.promoDel=el=>confirmBox('¿Borrar esta promoción?',()=>{const p=S.promos.find(x=>x.id===el.dataset.id);if(p)p.del=1;save(true);closeModal();render()},'Borrar',1);

(function(){const m=document.getElementById('appMark');if(m)m.src=APP_LOGO})();
function viewAnim(){const v=document.getElementById('view');if(!v)return;v.classList.remove('vin');void v.offsetWidth;v.classList.add('vin');clearTimeout(viewAnim.t);viewAnim.t=setTimeout(()=>v.classList.remove('vin'),1000)}
/* ===== INICIO DE SESIÓN (PIN obligatorio, se pide al abrir el programa) ===== */
const LGN={sel:'',cancel:false,fails:0,until:0,sig:'',mode:'',other:false,otherU:''};
const pinOk4=v=>/^\d{4,6}$/.test(v);
function anyAdminPin(){const P=S.cfg.pins||{};return !!P['*']||S.sellers.some(n=>roleOf(n)==='dueno'&&P[n])}
function adminAuth(v){const P=S.cfg.pins||{},h=phash(v);return (P['*']&&P['*']===h)||S.sellers.some(n=>roleOf(n)==='dueno'&&P[n]&&P[n]===h)}
function createUser(n,pin,role){n=n.trim();S.sellers.push(n);(S.cfg.sellMeta=S.cfg.sellMeta||{})[n]={t:Date.now(),d:0};
  (S.cfg.pins=S.cfg.pins||{})[n]=phash(pin);(S.cfg.pinT=S.cfg.pinT||{})[n]=Date.now();
  setProf(p=>{p.roles=Object.assign({},p.roles);p.roles[n]=role})}
function lgEl(){let e=document.getElementById('lgin');if(!e){e=document.createElement('div');e.id='lgin';e.setAttribute('role','dialog');e.setAttribute('aria-modal','true');
  e.style.cssText='position:fixed;inset:0;z-index:95;background:var(--bg);color:var(--fg);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 14px 24px;overflow-y:auto';
  document.body.appendChild(e);e.addEventListener('keydown',ev=>{if(ev.key==='Enter'){const b=e.querySelector('[data-enter]');if(b){ev.preventDefault();b.click()}}})}return e}
function loginShow(cancel){LGN.sel='';LGN.cancel=!!cancel;closeModal();loginDraw()}
function loginDraw(){const e=lgEl(),U=S.sellers.slice(),P=S.cfg.pins||{};
  LGN.sig=JSON.stringify([U,Object.keys(P).filter(k=>P[k])]);
  const fld=(id,l,ph)=>`<label class="f">${l}<input id="${id}" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="${ph||''}"></label>`;
  if(LGN.other&&JSON.stringify(U)!==LGN.otherU){LGN.other=false;LGN.mode=''}
  let b='',t='Iniciar sesión';
  if((!U.length||LGN.other)&&!LGN.mode){t='Bienvenido';b=`<p class="muted small lgq">Elija cómo va a usar este equipo.</p><button class="rcard own" data-act="lgMode" data-m="dueno"><span class="ri">🏪</span><span class="rt"><b>Crear mi negocio</b><small>Primera vez · soy el dueño</small></span><span class="ra">→</span></button><button class="rcard c2" data-act="lgMode" data-m="conn"><span class="ri">🔑</span><span class="rt"><b>Ya tengo mi cuenta</b><small>Soy el dueño y uso otro equipo</small></span><span class="ra">→</span></button><button class="rcard c3" data-act="lgMode" data-m="emp"><span class="ri">🧑‍💼</span><span class="rt"><b>Soy empleado</b><small>Entrar a un negocio que ya existe</small></span><span class="ra">→</span></button>`}
  else if((!U.length||LGN.other)&&LGN.mode==='conn'){t='Entrar a mi negocio';b=`<p class="muted small" style="margin:0">Conecte este equipo a su negocio para traer sus usuarios y datos:</p><ol class="small" style="margin:0;padding-left:20px;display:grid;gap:6px"><li>En el equipo donde ya usa STAR POS vaya a <b>Ajustes → Equipos y nube</b>, toque <b>«Copiar mi código»</b> y envíeselo (WhatsApp o correo).</li><li>Aquí toque <b>Conectar a la nube</b>, pegue el código y toque «Guardar y sincronizar».</li><li>Al terminar, elija su nombre e ingrese su PIN de siempre.</li></ol><button class="btn pri" data-act="cloudOpen">☁ Conectar a la nube</button><div style="border-top:1px solid var(--line);padding-top:10px;text-align:center"><div class="muted small" style="margin-bottom:6px">¿Prefiere usar un archivo de respaldo?</div><button class="btn" data-act="bkPick">Restaurar respaldo</button></div><button class="btn" data-act="lgMode" data-m="">Atrás</button>`}
  else if(LGN.other&&LGN.mode==='dueno'){t='Crear otro negocio';b=`<p class="muted small" style="margin:0">Este equipo ya tiene el negocio <b>${esc(S.cfg.name||'actual')}</b>. Para crear un negocio nuevo use otro equipo (o un navegador distinto), así no se mezclan los datos.</p><button class="btn" data-act="lgMode" data-m="">Atrás</button>`}
  else if((!U.length||LGN.other)&&LGN.mode==='emp'){t='Entrar como empleado';b=`<p class="muted small" style="margin:0">Para entrar necesita conectar este equipo al negocio:</p><ol class="small" style="margin:0;padding-left:20px;display:grid;gap:6px"><li>Pida al dueño su <b>código de conexión</b> (en su equipo: Ajustes → Equipos y nube → «Copiar mi código»).</li><li>Toque el botón de abajo y pegue el código en «Código de conexión».</li><li>Cuando termine de sincronizar, elija su nombre e ingrese su PIN.</li></ol><button class="btn pri" data-act="cloudOpen">☁ Conectar a la nube</button><button class="btn" data-act="lgMode" data-m="">Atrás</button>`}
  else if(!U.length){t='Crear administrador';b=`<p class="muted small" style="margin:0">Primera vez en este equipo. Cree el usuario administrador con su PIN (4 a 6 números).</p><label class="f">Nombre de su negocio<input id="lg_b" autocomplete="off" autofocus></label><label class="f">Su nombre<input id="lg_n" autocomplete="off"></label>${fld('lg_p','PIN')}${fld('lg_p2','Repita el PIN')}<button class="btn pri" data-act="lgFirst" data-enter>Crear y entrar</button><div style="border-top:1px solid var(--line);padding-top:10px;text-align:center"><div class="muted small" style="margin-bottom:6px">¿Ya tiene un respaldo de STAR POS?</div><button class="btn" data-act="bkPick">Restaurar respaldo</button><button class="btn" data-act="lgMode" data-m="conn" style="margin-top:6px">Ya tengo cuenta en otro equipo</button></div><button class="btn" data-act="lgMode" data-m="">Atrás</button>`}
  else if(!LGN.sel){b=`<p class="muted small" style="margin:0">¿Quién va a usar el programa?</p><div style="display:grid;gap:8px">${U.map(n=>`<button class="ucard" data-act="lgPick" data-n="${esc(n)}"><span class="av">${esc((n||'?').trim().charAt(0).toUpperCase())}</span><span class="un">${esc(n)}</span><span class="pill ${roleOf(n)==='dueno'?'ok':''}">${roleOf(n)==='dueno'?'Administrador':'Empleado'}</span></button>`).join('')}</div><button class="btn" data-act="lgOther">🏪 Entrar a otro negocio</button>${LGN.cancel?'<button class="btn" data-act="lgCancel">Volver sin cambiar</button>':''}`}
  else if(!P[LGN.sel]){const adm=roleOf(LGN.sel)==='dueno'&&anyAdminPin();t='Crear su PIN';
    b=`<p class="muted small" style="margin:0">Hola <b>${esc(LGN.sel)}</b>. Este usuario aún no tiene PIN y ahora es obligatorio.</p>${adm?fld('lg_a','PIN de un administrador (para autorizar)'):''}${fld('lg_p','Nuevo PIN (4 a 6 números)')}${fld('lg_p2','Repita el PIN')}<button class="btn pri" data-act="lgSetup" data-enter>Guardar y entrar</button><button class="btn" data-act="lgBack">Atrás</button>`}
  else{b=`<p class="muted small" style="margin:0">Usuario: <b>${esc(LGN.sel)}</b></p>${fld('lg_p','PIN')}<button class="btn pri" data-act="lgEnter" data-enter>Entrar</button><button class="btn" data-act="lgBack">Atrás</button>`}
  if(LGN.other&&U.length&&!LGN.sel)b+='<button class="btn" data-act="lgOtherOff">← Volver a '+esc(S.cfg.name||'mi negocio')+'</button>';
  e.innerHTML=`<div class="panel lgp"><div class="lgh"><div class="lglogo"><img src="${APP_LOGO}" alt="STAR POS" width="84" height="84"></div><h2>STAR POS</h2><div class="sub">Punto de Venta · ${t}</div></div>${b}</div>`;
  setTimeout(()=>{const f=e.querySelector('#lg_n,#lg_a,#lg_p');f&&f.focus()},30)}
function lgOk(n){S.cfg.cur=n;if(!S.caja){try{openCajaCore(lgBal('caja'),n)}catch(e){}}S.cfg.recentSellers=[n,...(S.cfg.recentSellers||[]).filter(x=>x!==n)].slice(0,5);LGN.sel='';LGN.cancel=false;LGN.fails=0;
  const e=document.getElementById('lgin');if(e){e.id='lgin-out';e.style.transition='opacity .22s ease';e.style.opacity='0';setTimeout(()=>e.remove(),230)}save(true);closeModal();render();
  if(shareOn()&&attList().length)setTimeout(()=>A.attPick(),60)}
A.lgPick=el=>{LGN.sel=el.dataset.n;loginDraw()};
A.lgOther=()=>{LGN.other=true;LGN.mode='';LGN.sel='';LGN.otherU=JSON.stringify(S.sellers.slice());loginDraw()};
A.lgOtherOff=()=>{LGN.other=false;LGN.mode='';LGN.sel='';loginDraw()};
A.lgMode=el=>{LGN.mode=el.dataset.m||'';loginDraw()};
A.lgBack=()=>{LGN.sel='';loginDraw()};
A.lgCancel=()=>{LGN.cancel=false;const e=document.getElementById('lgin');e&&e.remove()};
A.lgOut=()=>loginShow(true);
A.lgEnter=()=>{const n=LGN.sel,P=S.cfg.pins||{};if(Date.now()<LGN.until)return toast('Demasiados intentos. Espere unos segundos.',1);
  const i=document.getElementById('lg_p'),v=(i.value||'').trim();
  if(phash(v)!==P[n]){LGN.fails++;if(LGN.fails>=5){LGN.fails=0;LGN.until=Date.now()+30000;toast('5 intentos fallidos. Espere 30 segundos.',1)}else toast('PIN incorrecto.',1);i.value='';i.focus();const pn=document.querySelector('#lgin .panel');if(pn){pn.classList.remove('shake');void pn.offsetWidth;pn.classList.add('shake')}return}
  lgOk(n)};
A.lgSetup=()=>{const n=LGN.sel,v=($('#lg_p').value||'').trim(),v2=($('#lg_p2').value||'').trim(),a=$('#lg_a');
  if(roleOf(n)==='dueno'&&anyAdminPin()&&!adminAuth((a&&a.value||'').trim()))return toast('Falta el PIN de un administrador.',1);
  if(!pinOk4(v))return toast('Use de 4 a 6 números.',1);if(v!==v2)return toast('Los PIN no coinciden.',1);
  (S.cfg.pins=S.cfg.pins||{})[n]=phash(v);(S.cfg.pinT=S.cfg.pinT||{})[n]=Date.now();lgOk(n)};
A.lgFirst=()=>{const n=($('#lg_n').value||'').trim(),v=($('#lg_p').value||'').trim(),v2=($('#lg_p2').value||'').trim();
  if(!n)return toast('Escriba su nombre.',1);if(!pinOk4(v))return toast('Use de 4 a 6 números.',1);if(v!==v2)return toast('Los PIN no coinciden.',1);
  if(S.sellers.length)return;const nb=($('#lg_b').value||'').trim();if(nb)S.cfg.name=nb;createUser(n,v,'dueno');lgOk(n)};
/* usuarios: agregar / quitar (solo administrador) */
A.userAdd=()=>{if(!isOwner())return toast('Solo el administrador puede agregar usuarios.',1);
  const n=($('#nu_n').value||'').trim(),p=($('#nu_p').value||'').trim(),r=$('#nu_r').value;

function renameUser(old,nn){const now=Date.now(),M=S.cfg.sellMeta=S.cfg.sellMeta||{},P=S.cfg.pins=S.cfg.pins||{},T=S.cfg.pinT=S.cfg.pinT||{};
  const i=S.sellers.indexOf(old);if(i>=0)S.sellers[i]=nn;else S.sellers.push(nn);
  M[old]={t:now,d:1};M[nn]={t:now,d:0};P[nn]=P[old]||'';T[nn]=now;P[old]='';T[old]=now;
  if(S.cfg.bancoUsers&&old in S.cfg.bancoUsers){S.cfg.bancoUsers[nn]=S.cfg.bancoUsers[old];delete S.cfg.bancoUsers[old]}
  S.cfg.recentSellers=(S.cfg.recentSellers||[]).map(x=>x===old?nn:x);
  setProf(p=>{p.roles=Object.assign({},p.roles);p.roles[nn]=p.roles[old]||'dueno';delete p.roles[old]});
  const al=S.cfg.alias=S.cfg.alias||{};for(const k in al)if(al[k]===old)al[k]=nn;al[old]=nn;
  S.cfg.cur=nn;if(S.cfg.att===old)S.cfg.att=nn;applyAlias();save(true)}
function applyAlias(){const al=S.cfg.alias;if(!al)return 0;let ch=0;const f=x=>{let n=x,g=0;while(al[n]&&al[n]!==n&&g++<8)n=al[n];return n};
  for(const e of S.ledger||[])for(const k of ['u','by'])if(e[k]&&al[e[k]]){e[k]=f(e[k]);ch++}
  for(const h of S.cajaHist||[])for(const k of ['u','who'])if(h[k]&&al[h[k]]){h[k]=f(h[k]);ch++}
  for(const u of Object.keys(S.cajas||{}))if(al[u]){const t=f(u),c=S.cajas[u];delete S.cajas[u];c.u=t;if(c.who&&al[c.who])c.who=f(c.who);if(!S.cajas[t])S.cajas[t]=c;ch++}
  return ch}
